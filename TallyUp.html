<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TallyUp! — Live Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-a:#0b0c1e;--bg-b:#151a3a;--bg-c:#0d1f3c;
  --card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.12);
  --muted:rgba(255,255,255,0.5);
  --blue:#3B9EFF;--green:#36D48A;--red:#FF4C5B;--yellow:#FFB627;
}
body{
  background:linear-gradient(160deg,var(--bg-a) 0%,var(--bg-b) 50%,var(--bg-c) 100%);
  min-height:100vh;font-family:'Nunito',sans-serif;color:#fff;
}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.card{
  background:var(--card);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:20px;
  padding:30px 34px;width:100%;max-width:560px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.card.wide{max-width:700px}
h1,h2,h3{font-family:'Fredoka One',cursive}
.btn{display:block;width:100%;padding:13px 20px;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;color:#fff;transition:opacity .15s,transform .1s;margin-top:10px;letter-spacing:.4px;}
.btn:hover{opacity:.87}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-blue{background:var(--blue)}.btn-green{background:var(--green)}.btn-red{background:var(--red)}
.btn-yellow{background:var(--yellow);color:#1a1200}
.btn-ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.btn-dashed{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.3)}
.btn-sm{padding:5px 12px;font-size:.82rem;border-radius:7px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700}
.inp{display:block;width:100%;padding:12px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;color:#fff;font-family:'Nunito',sans-serif;font-weight:700;font-size:1rem;outline:none;}
.inp:focus{border-color:var(--blue)}
.lbl{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;margin-top:14px}
.sub{color:var(--muted);font-size:.95rem;margin:4px 0 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pbar{width:100%;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:4px}
.pfill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:4px;transition:width .5s}
.chip{display:inline-block;padding:5px 14px;border-radius:20px;background:rgba(54,212,138,.15);border:1px solid rgba(54,212,138,.35);font-weight:700;font-size:.9rem;margin:3px;}
.q-opt{width:100%;padding:18px 14px;border:2px solid;border-radius:14px;cursor:pointer;color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;text-align:center;transition:all .15s;}
.q-opt:hover{filter:brightness(1.1)}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:800;font-size:.82rem;}
.dots::after{content:'';animation:kdots 1.5s infinite}
@keyframes kdots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
.center{text-align:center}
.scrollbox{max-height:310px;overflow-y:auto}
textarea.inp{resize:vertical;min-height:68px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
/* Quiz library card */
.qlib-card{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;transition:border-color .15s;
}
.qlib-card:hover{border-color:rgba(59,158,255,.4)}
.qlib-meta{flex:1;min-width:0}
.qlib-name{font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qlib-info{font-size:.8rem;color:var(--muted);margin-top:2px}
/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e2a3a;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 20px;font-weight:700;font-size:.9rem;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
// ─────────────────────────────────────────
//  Constants
// ─────────────────────────────────────────
const COLORS = ['#FF4C5B','#36D48A','#3B9EFF','#FFB627','#A855F7','#F97316','#06B6D4','#EC4899'];
const SHAPES = ['▲','■','●','✦','⬟','★','⬡','♦'];
// Helper: get color/shape for option index, cycling if needed
function optColor(i){ return COLORS[i % COLORS.length]; }
function optShape(i){ return SHAPES[i % SHAPES.length]; }
const MEDALS = ['🥇','🥈','🥉'];
const PODIUM = ['#FFB627','#C0C0C0','#CD7F32'];
const LS_KEY = 'tallyup_quizzes_v1';

const DEFAULT_QS = [
  {q:"Which planet is the largest in our solar system?",  opts:["Saturn","Jupiter","Neptune","Uranus"],correct:1},
  {q:"How many bones are in the adult human body?",       opts:["196","206","216","226"],correct:1},
  {q:"What year did World War II end?",                   opts:["1943","1944","1945","1946"],correct:2},
  {q:"Which element has the chemical symbol 'Au'?",       opts:["Silver","Copper","Gold","Aluminum"],correct:2},
  {q:"What is the smallest country in the world?",        opts:["Monaco","Liechtenstein","Vatican City","San Marino"],correct:2},
];

// ─────────────────────────────────────────
//  Quiz Library (localStorage)
// ─────────────────────────────────────────
function libLoad() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch { return []; }
}
function libSave(quizzes) {
  localStorage.setItem(LS_KEY, JSON.stringify(quizzes));
}
function libSaveQuiz(name, questions) {
  const quizzes = libLoad();
  const existing = quizzes.findIndex(q => q.id === S.currentQuizId);
  const entry = {
    id: S.currentQuizId || ('quiz_' + Date.now()),
    name: name.trim(),
    questions: JSON.parse(JSON.stringify(questions)),
    savedAt: Date.now(),
    questionCount: questions.length,
  };
  if (existing >= 0) quizzes[existing] = entry;
  else quizzes.unshift(entry);
  libSave(quizzes);
  S.currentQuizId = entry.id;
  return entry;
}
function libDeleteQuiz(id) {
  libSave(libLoad().filter(q => q.id !== id));
}
function libGetQuiz(id) {
  return libLoad().find(q => q.id === id) || null;
}

// ─────────────────────────────────────────
//  App State
// ─────────────────────────────────────────
let S = {
  screen: 'landing',
  questions: JSON.parse(JSON.stringify(DEFAULT_QS)),
  currentQuizId: null,
  currentQuizName: '',
  roomCode: null,
  currentQ: 0,
  players: {},
  playerConns: {},
  peer: null,
  myName: null,
  myAnswers: {},
  hostConn: null,
  hostState: null,
  editIdx: null,
  editDraft: null,
  connStatus: 'idle',
  errMsg: null,
  presetCode: null,
  // Modal state
  modal: null,  // null | 'save' | 'edit-q' | 'confirm-delete'
  modalData: null,
};

// ─────────────────────────────────────────
//  Toast
// ─────────────────────────────────────────
let toastTimer = null;
function toast(msg, color='#36D48A') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.style.color = color;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─────────────────────────────────────────
//  Utilities
// ─────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function randCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<4;i++) c+=chars[Math.floor(Math.random()*chars.length)]; return c;
}
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function computeScores() {
  return Object.entries(S.players)
    .map(([name,p])=>({name,score:S.questions.reduce((s,q,i)=>s+(p.answers[i]===q.correct?1:0),0)}))
    .sort((a,b)=>b.score-a.score);
}

// ─────────────────────────────────────────
//  PeerJS Host
// ─────────────────────────────────────────
function buildStateForPlayer(name) {
  const isResults = S.screen==='host-results', isQ=S.screen==='host-q';
  return {
    view: isResults?'results':(S.screen==='host-lobby'?'lobby':'question'),
    currentQ:S.currentQ, totalQ:S.questions.length,
    question: isQ?{q:S.questions[S.currentQ].q,opts:S.questions[S.currentQ].opts}:null,
    answeredCount:Object.values(S.players).filter(p=>p.answers[S.currentQ]!==undefined).length,
    totalPlayers:Object.keys(S.players).length,
    playerNames:Object.keys(S.players),
    results: isResults?{questions:S.questions,myAnswers:(S.players[name]||{answers:{}}).answers,scores:computeScores()}:null,
  };
}
function hostSend(conn,name){ if(conn&&conn.open){try{conn.send({type:'state',state:buildStateForPlayer(name)});}catch(e){}} }
function hostBroadcast(){ Object.entries(S.playerConns).forEach(([n,c])=>hostSend(c,n)); }

function openLobby() {
  const code = randCode();
  S.roomCode=code; S.players={}; S.playerConns={}; S.connStatus='connecting'; render();
  const peer = new Peer('tup-'+code,{debug:0});
  S.peer=peer;
  peer.on('open',()=>{
    S.connStatus='connected'; S.screen='host-lobby';
    const u=new URL(window.location.href); u.hash='room='+code;
    window.history.replaceState({},u.toString()); render();
  });
  peer.on('error',err=>{
    if(err.type==='unavailable-id'){peer.destroy();openLobby();return;}
    S.connStatus='error'; S.errMsg='Could not create room. Check your connection.'; render();
  });
  peer.on('connection',conn=>{
    conn.on('data',data=>{
      if(data.type==='join'){
        const name=(data.name||'').trim().slice(0,20); if(!name) return;
        if(S.screen!=='host-lobby'){try{conn.send({type:'error',msg:'Game already in progress'});}catch(e){}return;}
        if(!S.players[name]) S.players[name]={answers:{}};
        S.playerConns[name]=conn; hostSend(conn,name); render();
      } else if(data.type==='answer'){
        const{name,qIdx,ansIdx}=data;
        if(S.players[name]&&S.screen==='host-q'&&qIdx===S.currentQ&&S.players[name].answers[qIdx]===undefined){
          S.players[name].answers[qIdx]=ansIdx; hostBroadcast(); render();
        }
      }
    });
    conn.on('close',()=>{const n=Object.entries(S.playerConns).find(([,c])=>c===conn)?.[0];if(n)delete S.playerConns[n];});
  });
}
function hostStart(){ S.screen='host-q'; S.currentQ=0; hostBroadcast(); render(); }
function hostNext(){
  const next=S.currentQ+1;
  S.screen = next>=S.questions.length ? 'host-results' : 'host-q';
  if(S.screen==='host-q') S.currentQ=next;
  hostBroadcast(); render();
}

// ─────────────────────────────────────────
//  PeerJS Player
// ─────────────────────────────────────────
function playerJoin(name,code){
  S.myName=name.trim().slice(0,20); S.connStatus='connecting'; render();
  const peer=new Peer(undefined,{debug:0}); S.peer=peer;
  let connected=false;
  peer.on('open',()=>{
    const conn=peer.connect('tup-'+code.toUpperCase(),{reliable:true,serialization:'json'});
    S.hostConn=conn;
    const timeout=setTimeout(()=>{ if(!connected){S.connStatus='error';S.errMsg='Could not find room "'+code.toUpperCase()+'". Check the code and that the host lobby is open.';render();}},9000);
    conn.on('open',()=>{connected=true;clearTimeout(timeout);conn.send({type:'join',name:S.myName});});
    conn.on('data',data=>{
      if(data.type==='state'){
        S.hostState=data.state; const v=data.state.view;
        if(v==='lobby') S.screen='player-lobby';
        else if(v==='question'){S.screen='player-q';S.currentQ=data.state.currentQ;}
        else if(v==='results') S.screen='player-results';
        S.connStatus='connected'; render();
      } else if(data.type==='error'){S.errMsg=data.msg;S.screen='player-join';render();}
    });
    conn.on('close',()=>{if(S.screen!=='player-results'){S.errMsg='Disconnected from host.';S.screen='player-join';render();}});
    conn.on('error',()=>{S.connStatus='error';S.errMsg='Connection failed. Check the room code.';render();});
  });
  peer.on('error',()=>{S.connStatus='error';S.errMsg='Could not connect. Check your internet connection.';render();});
}
function playerAnswer(ansIdx){
  const qIdx=S.currentQ;
  if(S.myAnswers[qIdx]!==undefined||!S.hostConn||!S.hostConn.open) return;
  S.myAnswers[qIdx]=ansIdx;
  S.hostConn.send({type:'answer',name:S.myName,qIdx,ansIdx}); render();
}

// ─────────────────────────────────────────
//  Render
// ─────────────────────────────────────────
function render(){ document.getElementById('app').innerHTML=getHTML(); bindEvents(); }
function getHTML(){
  let html='';
  switch(S.screen){
    case 'landing':       html=htmlLanding(); break;
    case 'library':       html=htmlLibrary(); break;
    case 'host-setup':    html=htmlHostSetup(); break;
    case 'host-lobby':    html=htmlHostLobby(); break;
    case 'host-q':        html=htmlHostQ(); break;
    case 'host-results':  html=htmlHostResults(); break;
    case 'player-join':   html=htmlPlayerJoin(); break;
    case 'player-lobby':  html=htmlPlayerLobby(); break;
    case 'player-q':      html=htmlPlayerQ(); break;
    case 'player-results':html=htmlPlayerResults(); break;
    default:              html=htmlLanding();
  }
  // Overlay modals on top
  if(S.modal==='save')           html+=htmlModalSave();
  if(S.modal==='edit-q')         html+=htmlModalEditQ();
  if(S.modal==='confirm-delete') html+=htmlModalConfirmDelete();
  return html;
}

// ─────────────────────────────────────────
//  HTML: Landing
// ─────────────────────────────────────────
function htmlLanding(){
  const count = libLoad().length;
  return `
  <div style="text-align:center;max-width:480px;width:100%">
    <div style="font-size:3.5rem;margin-bottom:8px">🎯</div>
    <h1 style="font-size:3.2rem;margin-bottom:8px">TallyUp!</h1>
    <p style="color:rgba(255,255,255,.55);margin-bottom:32px;font-size:1.05rem">Live quiz — scores revealed only at the very end</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:14px">
      <button id="go-host" class="btn btn-blue" style="width:190px;padding:18px;font-size:1.05rem;margin-top:0">🖥️ Host a Game</button>
      <button id="go-join" class="btn btn-green" style="width:190px;padding:18px;font-size:1.05rem;margin-top:0">📱 Join a Game</button>
    </div>
    <button id="go-library" class="btn btn-ghost" style="width:auto;display:inline-block;padding:10px 24px;font-size:.9rem;margin-top:0">
      📚 My Quizzes ${count>0?`<span style="background:rgba(59,158,255,.35);border-radius:10px;padding:1px 8px;margin-left:6px;font-size:.82rem">${count}</span>`:''}
    </button>
  </div>`;
}

// ─────────────────────────────────────────
//  HTML: Library
// ─────────────────────────────────────────
function htmlLibrary(){
  const quizzes = libLoad();
  const rows = quizzes.length===0
    ? `<div style="text-align:center;padding:32px 0;color:rgba(255,255,255,.3);font-size:.95rem">No saved quizzes yet.<br>Create one from the Host screen!</div>`
    : quizzes.map(q=>`
      <div class="qlib-card">
        <div style="font-size:1.8rem">${quizIcon(q.name)}</div>
        <div class="qlib-meta">
          <div class="qlib-name">${esc(q.name)}</div>
          <div class="qlib-info">${q.questionCount} question${q.questionCount!==1?'s':''} &bull; Saved ${fmtDate(q.savedAt)}</div>
        </div>
        <div style="display:flex;gap:7px;flex-shrink:0">
          <button class="btn-sm lib-host" data-id="${esc(q.id)}" style="background:rgba(59,158,255,.25);color:var(--blue)">▶ Host</button>
          <button class="btn-sm lib-edit" data-id="${esc(q.id)}" style="background:rgba(255,255,255,.1);color:#fff">Edit</button>
          <button class="btn-sm lib-del"  data-id="${esc(q.id)}" style="background:rgba(255,76,91,.2);color:var(--red)">✕</button>
        </div>
      </div>`).join('');

  return `
  <div class="card wide">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <button id="back-landing" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0">←</button>
      <h2 style="font-size:1.9rem">📚 My Quizzes</h2>
    </div>
    <p class="sub">${quizzes.length} saved quiz${quizzes.length!==1?'zes':''} — stored in your browser</p>
    <div class="scrollbox">${rows}</div>
    <button id="lib-new" class="btn btn-dashed" style="margin-top:14px">+ Create New Quiz</button>
  </div>`;
}

function quizIcon(name){
  const icons=['📝','🎓','🧠','🔬','📖','🗺️','🎭','⚽','🎵','🍕'];
  let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))&0xffff;
  return icons[h%icons.length];
}

// ─────────────────────────────────────────
//  HTML: Host Setup
// ─────────────────────────────────────────
function htmlHostSetup(){
  const qRows = S.questions.map((q,i)=>`
    <div style="background:rgba(255,255,255,.05);border-radius:10px;padding:10px 14px;margin-bottom:7px;display:flex;align-items:center;gap:9px">
      <span style="font-weight:700;color:rgba(255,255,255,.35);font-size:.85rem;min-width:26px">Q${i+1}</span>
      <span style="flex:1;font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.q)}</span>
      <span style="font-size:.78rem;color:${optColor(q.correct)};font-weight:700;flex-shrink:0">${optShape(q.correct)}</span>
      <button class="edit-q btn-sm" data-i="${i}" style="background:rgba(59,158,255,.2);color:var(--blue)">Edit</button>
      <button class="del-q  btn-sm" data-i="${i}" style="background:rgba(255,76,91,.2);color:var(--red)">✕</button>
    </div>`).join('');

  const savedBadge = S.currentQuizId
    ? `<span style="background:rgba(54,212,138,.2);border:1px solid rgba(54,212,138,.35);border-radius:10px;padding:3px 10px;font-size:.8rem;font-weight:700;color:var(--green);margin-left:8px">✓ Saved</span>`
    : '';

  const errHtml = S.errMsg ? `<p style="color:var(--red);text-align:center;margin-top:8px;font-weight:700">${esc(S.errMsg)}</p>` : '';
  const connecting = S.connStatus==='connecting' ? `<p style="color:var(--muted);text-align:center;margin-top:8px;font-size:.9rem">Creating room<span class="dots"></span></p>` : '';

  return `
  <div class="card wide">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap">
      <button id="back-landing" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0">←</button>
      <h2 style="font-size:1.9rem;flex:1">
        ${S.currentQuizName ? esc(S.currentQuizName) : '📋 New Quiz'}
        ${savedBadge}
      </h2>
      <div style="display:flex;gap:8px">
        <button id="save-quiz" class="btn-sm" style="background:rgba(255,182,39,.25);color:var(--yellow);border:1px solid rgba(255,182,39,.35)" title="Save quiz">💾 Save</button>
        <button id="go-library-setup" class="btn-sm btn-ghost" style="border:1px solid rgba(255,255,255,.15)" title="My Quizzes">📚 Library</button>
      </div>
    </div>
    <p class="sub">${S.questions.length} question${S.questions.length!==1?'s':''}</p>
    <div class="scrollbox" style="margin-bottom:10px">${qRows}</div>
    <button id="add-q" class="btn btn-dashed" style="margin-bottom:10px">+ Add Question</button>
    <button id="open-lobby" class="btn btn-blue" style="font-size:1.1rem;padding:16px" ${S.questions.length===0?'disabled':''}>Open Lobby →</button>
    ${connecting}${errHtml}
  </div>`;
}

// ─────────────────────────────────────────
//  HTML: Modal — Save Quiz
// ─────────────────────────────────────────
function htmlModalSave(){
  const name = S.currentQuizName || '';
  return `
  <div class="modal-overlay" id="modal">
    <div class="card" style="max-width:420px">
      <h3 style="font-size:1.5rem;margin-bottom:14px">💾 Save Quiz</h3>
      <label class="lbl" style="margin-top:0">Quiz Name</label>
      <input id="quiz-name-inp" class="inp" value="${esc(name)}" placeholder="e.g. Science Bowl 2025" maxlength="60" style="font-size:1.05rem">
      <p style="color:rgba(255,255,255,.35);font-size:.82rem;margin-top:8px">Saved to your browser — stays there even if you close the tab.</p>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button id="modal-cancel" class="btn btn-ghost" style="flex:1;margin-top:0">Cancel</button>
        <button id="modal-save-confirm" class="btn btn-yellow" style="flex:2;margin-top:0">Save Quiz ✓</button>
      </div>
    </div>
  </div>`;
}

// ─────────────────────────────────────────
//  HTML: Modal — Edit Question
// ─────────────────────────────────────────
function htmlModalEditQ(){
  const d=S.editDraft;
  const title=S.editIdx===-1?'New Question':`Edit Q${S.editIdx+1}`;

// ─────────────────────────────────────────
//  Event Binding
// ─────────────────────────────────────────
function bindEvents(){
  function on(id,evt,fn){const el=document.getElementById(id);if(el)el.addEventListener(evt,fn);}
  function all(sel,evt,fn){document.querySelectorAll(sel).forEach(el=>el.addEventListener(evt,fn));}

  // Landing
  on('go-host','click',()=>{S.screen='host-setup';S.editIdx=null;S.questions=JSON.parse(JSON.stringify(DEFAULT_QS));S.currentQuizId=null;S.currentQuizName='';S.errMsg=null;render();});
  on('go-join','click',()=>{S.screen='player-join';render();});
  on('go-library','click',()=>{S.screen='library';render();});

  // Back buttons
  on('back-landing','click',()=>{
    if(S.peer){S.peer.destroy();S.peer=null;}
    S.screen='landing';S.errMsg=null;S.connStatus='idle';render();
  });

  // Library
  on('lib-new','click',()=>{S.screen='host-setup';S.questions=[];S.currentQuizId=null;S.currentQuizName='';render();});
  all('.lib-host','click',e=>{
    const q=libGetQuiz(e.currentTarget.dataset.id);
    if(!q) return;
    S.questions=JSON.parse(JSON.stringify(q.questions));
    S.currentQuizId=q.id; S.currentQuizName=q.name;
    S.screen='host-setup'; render();
  });
  all('.lib-edit','click',e=>{
    const q=libGetQuiz(e.currentTarget.dataset.id);
    if(!q) return;
    S.questions=JSON.parse(JSON.stringify(q.questions));
    S.currentQuizId=q.id; S.currentQuizName=q.name;
    S.screen='host-setup'; render();
  });
  all('.lib-del','click',e=>{
    S.modal='confirm-delete'; S.modalData=e.currentTarget.dataset.id; render();
  });
  on('go-library-setup','click',()=>{S.screen='library';render();});
  on('back-library-results','click',()=>{
    if(S.peer){S.peer.destroy();S.peer=null;}
    S.players={}; S.playerConns={}; S.myAnswers={}; S.currentQ=0; S.roomCode=null; S.connStatus='idle';
    window.history.replaceState({},'',(()=>{const u=new URL(window.location.href);u.hash='';return u.toString();})());
    S.screen='library'; render();
  });

  // Host Setup
  on('save-quiz','click',()=>{S.modal='save';render();});
  on('add-q','click',()=>{S.editIdx=-1;S.editDraft={q:'',opts:['',''],correct:0};S.modal='edit-q';render();});
  on('open-lobby','click',()=>{ if(S.questions.length>0) openLobby(); });
  all('.edit-q','click',e=>{
    const i=parseInt(e.currentTarget.dataset.i);
    S.editIdx=i;S.editDraft={...S.questions[i],opts:[...S.questions[i].opts]};S.modal='edit-q';render();
  });
  all('.del-q','click',e=>{
    S.questions.splice(parseInt(e.currentTarget.dataset.i),1);render();
  });

  // Helper: sync current input values into S.editDraft before re-rendering
  function syncDraftFromModal(){
    const qt=document.getElementById('edit-q-text');
    if(qt) S.editDraft.q=qt.value;
    document.querySelectorAll('.opt-inp').forEach(inp=>{
      S.editDraft.opts[parseInt(inp.dataset.oi)]=inp.value;
    });
  }

  // Save modal
  on('modal-save-confirm','click',()=>{
    const nameInp=document.getElementById('quiz-name-inp');
    const name=(nameInp?.value||'').trim()||'Untitled Quiz';
    S.currentQuizName=name;
    libSaveQuiz(name,S.questions);
    S.modal=null; render(); toast('✓ Quiz saved: '+name);
  });

  // Edit Q modal
  on('modal-cancel','click',()=>{S.modal=null;render();});
  on('modal','click',e=>{if(e.target.id==='modal'){S.modal=null;render();}});
  on('modal-save','click',()=>{
    syncDraftFromModal();
    if(!S.editDraft.q.trim()||S.editDraft.opts.some(o=>!o.trim())){toast('⚠️ Fill in the question and all options','#FF4C5B');return;}
    if(S.editIdx===-1) S.questions.push({...S.editDraft,opts:[...S.editDraft.opts]});
    else S.questions[S.editIdx]={...S.editDraft,opts:[...S.editDraft.opts]};
    if(S.currentQuizId&&S.currentQuizName) libSaveQuiz(S.currentQuizName,S.questions);
    S.modal=null; render();
  });
  // Add / remove option buttons (inside edit-q modal)
  on('add-opt','click',()=>{
    syncDraftFromModal();
    S.editDraft.opts.push('');
    render();
  });
  all('.del-opt','click',e=>{
    if(S.editDraft.opts.length<=2) return;
    syncDraftFromModal();
    const i=parseInt(e.currentTarget.dataset.oi);
    S.editDraft.opts.splice(i,1);
    if(S.editDraft.correct>=i && S.editDraft.correct>0) S.editDraft.correct--;
    render();
  });

  all('.set-correct','click',e=>{
    syncDraftFromModal();
    S.editDraft.correct=parseInt(e.currentTarget.dataset.oi);
    render();
  });

  // Delete confirm modal
  on('modal-delete-confirm','click',()=>{
    const id=S.modalData;
    const q=libGetQuiz(id);
    libDeleteQuiz(id);
    if(S.currentQuizId===id){S.currentQuizId=null;S.currentQuizName='';}
    S.modal=null; S.modalData=null; render();
    toast('🗑️ Deleted: '+(q?.name||'quiz'));
  });

  // Host Lobby
  on('copy-url','click',()=>{
    const btn=document.getElementById('copy-url');
    navigator.clipboard?.writeText(window.location.href).then(()=>{if(btn){btn.textContent='✓ Copied!';setTimeout(()=>{if(btn)btn.textContent='📋 Copy Link';},2000);}});
  });
  on('start-game','click',()=>{if(Object.keys(S.players).length>0) hostStart();});

  // Host Q
  on('next-q','click',hostNext);

  // Host Results
  on('play-again','click',()=>{
    if(S.peer) S.peer.destroy();
    S.peer=null;S.players={};S.playerConns={};S.myAnswers={};S.currentQ=0;S.roomCode=null;S.connStatus='idle';S.errMsg=null;
    window.history.replaceState({},'',(()=>{const u=new URL(window.location.href);u.hash='';return u.toString();})());
    S.screen='host-setup'; render();
  });

  // Player Join
  on('do-join','click',()=>{
    const n=(document.getElementById('player-name')||{}).value||'';
    const c=(document.getElementById('room-code')||{}).value||'';
    if(!n.trim()||c.trim().length<4) return;
    S.errMsg=null; playerJoin(n,c.trim());
  });
  const codeInp=document.getElementById('room-code');
  if(codeInp){
    codeInp.addEventListener('input',()=>{codeInp.value=codeInp.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});
    codeInp.addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('do-join')?.click();});
  }
  const nameInp=document.getElementById('player-name');
  if(nameInp) nameInp.addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('room-code')?.focus();});

  // Player Q
  all('.ans-pick','click',e=>{playerAnswer(parseInt(e.currentTarget.dataset.ans));});

  // Save modal — name input enter key
  const qni=document.getElementById('quiz-name-inp');
  if(qni) qni.addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('modal-save-confirm')?.click();});
}

// ─────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const hash=window.location.hash;
  const m=hash.match(/room=([A-Z0-9]{4})/i);
  if(m){ S.screen='player-join'; S.presetCode=m[1].toUpperCase(); }
  render();
});
</script>
</body>
</html>
