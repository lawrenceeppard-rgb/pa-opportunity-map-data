<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Price Is Right! — Classroom Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --black:  #000000;
  --red:    #CC0000;
  --red2:   #EE1111;
  --yellow: #FFD700;
  --yellow2:#FFEC5C;
  --white:  #FFFFFF;
  --card-bg: rgba(0,0,0,0.04);
  --card-border: rgba(0,0,0,0.1);
}

html,body{min-height:100%;overflow-x:hidden}

body{
  background: #ffffff;
  background-attachment: fixed;
  font-family:'Nunito',sans-serif;
  color:#111;
}

/* dot-grid texture */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image: radial-gradient(rgba(0,0,48,0.07) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events:none;z-index:0;
}

#app{position:relative;z-index:1}

/* ── TOP TICKER ──────────────────────────────────── */
.cod-banner{
  background: repeating-linear-gradient(90deg, #CC0000 0px, #CC0000 120px, #AA0000 120px, #AA0000 240px);
  background-size: 480px 100%;
  animation: tick 4s linear infinite;
  text-align:center;padding:7px 20px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(0.75rem,2.5vw,0.95rem);
  letter-spacing:0.5em;color:#FFD700;
  position:sticky;top:0;z-index:100;
  box-shadow:0 3px 18px rgba(0,0,0,0.7);
}
@keyframes tick{from{background-position:0 0}to{background-position:-480px 0}}

/* ── LOGO ────────────────────────────────────────── */
.logo-wrap{
  display:flex;justify-content:center;align-items:center;
  padding:20px 16px 8px;
  position:relative;
}
.logo-wrap::before{
  content:'';position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at 50% 60%, rgba(204,0,0,0.08) 0%, transparent 65%);
  pointer-events:none;
}
.logo-img{
  width:clamp(220px, 50vw, 360px);
  height:auto;
  display:block;
  /* subtle glow matching the show logo */
  filter: drop-shadow(0 0 22px rgba(204,0,0,0.5))
          drop-shadow(0 0 48px rgba(255,215,0,0.18));
}
.logo-sub{
  text-align:center;
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(0.65rem,1.6vw,0.8rem);
  letter-spacing:0.6em;
  color:rgba(0,0,0,0.35);
  text-transform:uppercase;
  padding-bottom:14px;
}

/* ── LAYOUT ──────────────────────────────────────── */
.container{max-width:820px;margin:0 auto;padding:12px 14px 40px}

.two-col{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.two-col>*{flex:1;min-width:220px}

/* ── CARDS ───────────────────────────────────────── */
.card{
  background:var(--card-bg);

  border:1.5px solid var(--card-border);
  border-radius:16px;padding:22px;margin-bottom:14px;
}
.card-gold{
  background:rgba(255,200,0,0.1);
  border-color:rgba(255,215,0,0.45);
}
.card-red{
  background:rgba(180,0,0,0.08);
  border-color:rgba(220,0,0,0.4);
}
.card-green{
  background:rgba(0,140,50,0.15);
  border-color:rgba(0,190,70,0.4);
}

/* ── TYPE ────────────────────────────────────────── */
.section-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:1.25rem;font-weight:900;
  color:#FFD700;letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:13px;
  display:flex;align-items:center;gap:7px;
}
.subtext{color:rgba(0,0,0,0.5);font-size:0.88rem}

hr.divider{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:14px 0}

/* ── BUTTONS ─────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 26px;border-radius:6px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:1.05rem;font-weight:900;
  letter-spacing:0.08em;text-transform:uppercase;
  cursor:pointer;border:none;white-space:nowrap;line-height:1;
  transition:transform .12s, filter .12s, box-shadow .12s;
}
.btn:active{transform:scale(0.96)}
.btn:disabled{opacity:.42;cursor:not-allowed}

.btn-gold{
  background:linear-gradient(180deg,#FFE555 0%,#FFD000 50%,#E09000 100%);
  color:#000;box-shadow:0 4px 18px rgba(255,190,0,0.4);
}
.btn-gold:not(:disabled):hover{filter:brightness(1.09);transform:translateY(-2px)}

.btn-red{
  background:linear-gradient(180deg,#FF2222,#990000);
  color:#fff;box-shadow:0 4px 16px rgba(180,0,0,0.45);
}
.btn-red:not(:disabled):hover{filter:brightness(1.12)}

.btn-green{
  background:linear-gradient(180deg,#22DD66,#007733);
  color:#fff;box-shadow:0 4px 14px rgba(0,150,60,0.4);
}
.btn-blue{
  background:linear-gradient(180deg,#4488FF,#1133CC);
  color:#fff;box-shadow:0 4px 14px rgba(30,80,220,0.4);
}
.btn-ghost{
  background:rgba(0,0,0,0.06);
  border:1.5px solid rgba(0,0,0,0.2);
  color:rgba(0,0,0,0.7);
}
.btn-ghost:hover{background:rgba(0,0,0,0.1)}

.btn-lg  {padding:16px 42px;font-size:1.2rem}
.btn-sm  {padding:8px 18px;font-size:0.88rem}
.btn-block{display:flex;width:100%}

/* ── INPUTS ──────────────────────────────────────── */
.input-group{margin-bottom:14px}
.input-label{
  display:block;font-weight:900;font-size:0.75rem;
  letter-spacing:0.15em;color:#FFD700;text-transform:uppercase;margin-bottom:5px;
  font-family:'Barlow Condensed',sans-serif;
}
.input-field{
  width:100%;padding:11px 15px;
  background:rgba(0,0,0,0.04);
  border:2px solid rgba(180,0,0,0.3);
  border-radius:7px;color:#111;
  font-size:1rem;font-family:'Nunito',sans-serif;font-weight:700;
  outline:none;transition:border-color .2s,background .2s;
}
.input-field:focus{border-color:#CC0000;background:rgba(255,255,255,0.9)}
.input-field::placeholder{color:rgba(0,0,0,0.3)}

/* ── ROOM CODE ───────────────────────────────────── */
.room-code-display{text-align:center}
.room-code-label{
  font-size:0.68rem;letter-spacing:0.45em;
  color:rgba(0,0,0,0.45);text-transform:uppercase;margin-bottom:3px;
  font-family:'Barlow Condensed',sans-serif;
}
.room-code{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:clamp(3.2rem,11vw,5.5rem);
  color:#FFD700;letter-spacing:0.18em;line-height:1;
  text-shadow:3px 3px 0 rgba(0,0,0,0.5),0 0 30px rgba(255,215,0,0.35);
}

/* ── TIMER ───────────────────────────────────────── */
.timer-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.timer-svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
.timer-track{fill:none;stroke:rgba(255,255,255,0.08)}
.timer-fill {fill:none;stroke:#FFD700;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}
.timer-fill.urgent{stroke:#CC0000}
.timer-number{font-family:'Barlow Condensed',sans-serif;font-weight:900;color:#FFD700;line-height:1;z-index:1}
.timer-number.urgent{color:#FF3333;animation:pulse .5s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}

/* ── PLAYER CHIPS ────────────────────────────────── */
.player-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{
  background:rgba(0,0,0,0.05);
  border:1.5px solid rgba(0,0,0,0.15);
  border-radius:5px;padding:7px 14px;
  font-weight:800;font-size:0.88rem;
  display:flex;align-items:center;gap:5px;
  transition:background .3s,border-color .3s;
}
.chip.submitted{background:rgba(0,160,50,0.25);border-color:#00AA33;color:#88FFAA}
.chip.winner{background:rgba(255,215,0,0.25);border-color:#FFD700;color:#FFD700;animation:glow-gold 1s infinite alternate}
@keyframes glow-gold{from{box-shadow:0 0 5px rgba(255,215,0,0.3)}to{box-shadow:0 0 18px rgba(255,215,0,0.75)}}

/* ── PRIZE BOX ───────────────────────────────────── */
.prize-box{
  background:rgba(204,0,0,0.06);
  border:2px solid rgba(204,0,0,0.4);
  border-radius:12px;padding:18px;text-align:center;
}
.prize-eyebrow{
  font-size:0.68rem;letter-spacing:0.45em;
  color:rgba(0,0,0,0.4);text-transform:uppercase;margin-bottom:7px;
  font-family:'Barlow Condensed',sans-serif;
}
.prize-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:clamp(1.2rem,4vw,2rem);color:#111;line-height:1.2;margin-bottom:5px;
}
.prize-hint{font-size:0.84rem;color:rgba(0,0,0,0.45);font-style:italic}

/* ── REVEAL ──────────────────────────────────────── */
.reveal-box{
  background:linear-gradient(135deg,rgba(204,0,0,0.12),rgba(255,255,255,0.8));
  border:3px solid #CC0000;border-radius:16px;
  padding:22px 18px;text-align:center;margin-bottom:14px;
}
.reveal-label{
  font-size:0.72rem;letter-spacing:0.5em;color:rgba(0,0,0,0.5);
  text-transform:uppercase;margin-bottom:7px;
  font-family:'Barlow Condensed',sans-serif;
}
.reveal-amount{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:clamp(3rem,12vw,6rem);color:#FFD700;
  text-shadow:3px 3px 0 rgba(0,0,0,0.18),0 0 25px rgba(255,215,0,0.2);
  line-height:1;animation:pop-in .45s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes pop-in{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ── RESULTS LIST ────────────────────────────────── */
.results-list{list-style:none;margin-top:9px}
.results-list li{
  display:flex;align-items:center;gap:9px;
  padding:10px 14px;border-radius:8px;margin-bottom:6px;
  background:rgba(0,0,0,0.04);font-weight:700;font-size:.97rem;
  animation:slide-up .3s ease both;
}
.results-list li:nth-child(1){animation-delay:.05s}
.results-list li:nth-child(2){animation-delay:.10s}
.results-list li:nth-child(3){animation-delay:.15s}
.results-list li:nth-child(4){animation-delay:.20s}
.results-list li:nth-child(5){animation-delay:.25s}
@keyframes slide-up{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

.res-winner{background:rgba(255,215,0,0.18)!important;border:1.5px solid rgba(255,215,0,0.5);color:#FFD700}
.res-over  {background:rgba(180,0,0,0.18)!important;color:rgba(255,150,150,0.9)}
.res-rank  {width:28px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.15rem;opacity:.65;text-align:center;flex-shrink:0}
.res-name  {flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-bid   {font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.25rem;letter-spacing:.03em;flex-shrink:0}
.res-diff  {font-size:.76rem;opacity:.6;min-width:70px;text-align:right;flex-shrink:0}

/* ── LEADERBOARD ─────────────────────────────────── */
.lb-wrap{background:rgba(0,0,0,0.05);border-radius:12px;padding:13px}
.lb-title{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:1.1rem;color:#FFD700;text-align:center;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;
}
.lb-row{
  display:flex;align-items:center;gap:9px;
  padding:6px 9px;border-radius:7px;margin-bottom:3px;font-weight:700;font-size:.93rem;
}
.lb-row:first-of-type{background:rgba(255,215,0,0.14)}
.lb-rank {width:24px;color:#FFD700;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.05rem}
.lb-name {flex:1}
.lb-score{color:#FFD700;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem}

/* ── QR ──────────────────────────────────────────── */
.qr-wrap{
  display:inline-block;background:#fff;border-radius:10px;
  padding:9px;box-shadow:0 6px 24px rgba(0,0,0,0.6);
}
.qr-wrap img{display:block;border-radius:3px}

/* ── STATUS BAR ──────────────────────────────────── */
.status-bar{
  display:flex;align-items:center;justify-content:space-between;gap:9px;
  background:rgba(0,0,0,0.06);border-radius:9px;
  padding:9px 14px;margin-bottom:13px;font-size:.88rem;font-weight:700;flex-wrap:wrap;
}
.live-dot{
  width:8px;height:8px;border-radius:50%;
  background:#00CC44;display:inline-block;margin-right:5px;
  animation:blink 1s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── WAITING DOTS ────────────────────────────────── */
.waiting-dots span{
  display:inline-block;animation:wdot 1.4s ease-in-out infinite both;
  font-size:1.5rem;color:#FFD700;
}
.waiting-dots span:nth-child(2){animation-delay:.2s}
.waiting-dots span:nth-child(3){animation-delay:.4s}
@keyframes wdot{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

/* ── CONFETTI ROW ────────────────────────────────── */
.confetti-row{text-align:center;font-size:1.5rem;letter-spacing:.2em;margin:5px 0 11px;animation:slide-up .4s ease both}

/* ── JOIN ERROR ──────────────────────────────────── */
.join-error{color:#FF9999;font-size:.87rem;margin-top:9px;text-align:center;min-height:20px;font-weight:700}

/* ── TOAST ───────────────────────────────────────── */
#toast{
  position:fixed;bottom:26px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:rgba(20,0,0,0.92);
  border:1.5px solid rgba(255,215,0,0.6);
  color:#fff;padding:10px 22px;border-radius:5px;
  font-weight:800;font-size:.9rem;
  transition:transform .25s;z-index:999;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── MOBILE ──────────────────────────────────────── */
@media(max-width:520px){
  .card{padding:16px}
  .btn-lg{padding:13px 26px;font-size:1.1rem}
  .two-col>*{min-width:100%}
}
</style>
</head>

<script>
/* ============================================================
   STATE
============================================================ */
const S = {
  mode: null, screen: 'landing',
  roomCode: null, peer: null, timer: null, timeLeft: 20,
  // Host
  playerConns:{}, players:{}, bids:{}, scores:{},
  currentItem:'', currentPrice:0, currentHint:'', roundNum:0,
  // Player
  hostConn:null, myName:'', myBid:null, itemData:null, roundResults:null,
};

/* ============================================================
   UTILITIES
============================================================ */
function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r='';for(let i=0;i<4;i++)r+=c[Math.floor(Math.random()*c.length)];
  return r;
}
function fmt(n){
  if(n===null||n===undefined||n==='')return'—';
  const v=Number(n);if(isNaN(v))return'—';
  return'$'+v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
}
function esc(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg,ms=2800){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),ms);
}
function calcWinner(bids,actualPrice){
  const entries=Object.entries(bids);
  const valid=entries.filter(([,v])=>v<=actualPrice);
  if(!valid.length)return{winnersArr:[],overBidders:entries.map(([k])=>k)};
  const maxBid=Math.max(...valid.map(([,v])=>v));
  const winnersArr=valid.filter(([,v])=>v===maxBid).map(([k])=>k);
  const overBidders=entries.filter(([,v])=>v>actualPrice).map(([k])=>k);
  return{winnersArr,overBidders,maxBid};
}
function sortedBids(bids,actualPrice){
  return Object.entries(bids).sort(([,a],[,b])=>{
    const ao=a>actualPrice,bo=b>actualPrice;
    if(!ao&&bo)return -1;if(ao&&!bo)return 1;
    if(!ao&&!bo)return b-a;return a-b;
  });
}

/* ============================================================
   RENDER
============================================================ */
function render(){document.getElementById('app').innerHTML=getHTML();bindEvents();if(S.screen==='host-lobby')generateQR();}
function getHTML(){
  switch(S.screen){
    case 'landing':         return htmlLanding();
    case 'host-setup':      return htmlHostSetup();
    case 'host-lobby':      return htmlHostLobby();
    case 'host-game':       return htmlHostGame();
    case 'host-results':    return htmlHostResults();
    case 'player-join':     return htmlPlayerJoin();
    case 'player-lobby':    return htmlPlayerLobby();
    case 'player-game':     return htmlPlayerGame();
    case 'player-submitted':return htmlPlayerSubmitted();
    case 'player-results':  return htmlPlayerResults();
    default:return'<div class="container"><div class="card">Unknown screen.</div></div>';
  }
}

/* ============================================================
   SCREENS — LANDING
============================================================ */
function htmlLanding(){
  const m=window.location.hash.match(/join=([A-Z0-9]{4})/i);
  if(m){setTimeout(()=>{S.mode='player';S.screen='player-join';render();},60);
    return`<div class="container"><div class="card" style="text-align:center"><p style="color:#FFD700;font-weight:800">Joining game…</p></div></div>`;}
  return`
  <div class="container">
    <div class="card" style="text-align:center;padding:34px 22px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2rem;color:#FFD700;letter-spacing:.06em;margin-bottom:8px">
        WELCOME!</div>
      <p class="subtext" style="margin-bottom:28px;font-size:1rem">Are you running the game or playing?</p>
      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-red btn-lg" id="btn-host">🎬 &nbsp; I'M THE HOST</button>
        <button class="btn btn-gold btn-lg" id="btn-player">🎮 &nbsp; I'M A PLAYER</button>
      </div>
    </div>
    <div class="card" style="opacity:.55;font-size:.84rem;text-align:center">
      <p>🎯 <strong>How it works:</strong> The host names an item. Players bid what they think it costs.
      The closest bid without going over wins — classic Price Is Right rules!</p>
    </div>
  </div>`;
}

/* ============================================================
   SCREENS — HOST SETUP
============================================================ */
function htmlHostSetup(){
  return`
  <div class="container">
    <div class="card">
      <div class="section-title">🏷️ Round ${S.roundNum+1} — Set Up Your Question</div>
      <div class="input-group">
        <label class="input-label">Item / Prize Name</label>
        <input class="input-field" id="inp-item" placeholder="e.g. Monthly rent for a 2BR apartment in Philadelphia" value="${esc(S.currentItem)}">
      </div>
      <div class="input-group">
        <label class="input-label">Actual Price ($) — Only you see this!</label>
        <input class="input-field" id="inp-price" type="number" min="0" step="0.01" placeholder="e.g. 1850" value="${S.currentPrice||''}">
      </div>
      <div class="input-group">
        <label class="input-label">Hint for Students (optional)</label>
        <input class="input-field" id="inp-hint" placeholder="e.g. National median, 2024 data" value="${esc(S.currentHint)}">
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <button class="btn btn-gold" id="btn-open-lobby">Open Lobby →</button>
        ${S.roundNum>0?`<button class="btn btn-ghost btn-sm" id="btn-back-results">← Back to Results</button>`:''}
      </div>
    </div>
  </div>`;
}

/* ============================================================
   SCREENS — HOST LOBBY
============================================================ */
function htmlHostLobby(){
  const names=Object.keys(S.players);
  const joinUrl=window.location.origin+window.location.pathname+'#join='+S.roomCode;
  return`
  <div class="container">
    <div class="two-col">
      <div class="card card-gold" style="text-align:center;flex:0 0 235px">
        <div class="section-title" style="justify-content:center;font-size:.95rem">📱 Students Scan to Join</div>
        <div id="qr-mount" style="display:flex;justify-content:center;margin-bottom:12px"></div>
        <div class="room-code-label">ROOM CODE</div>
        <div class="room-code">${S.roomCode}</div>
        <div style="font-size:.68rem;color:rgba(0,0,0,0.35);margin-top:7px;word-break:break-all">${esc(joinUrl)}</div>
      </div>

/* ============================================================
   BIND EVENTS
============================================================ */
function bindEvents(){
  const $=id=>document.getElementById(id);
  switch(S.screen){
    case 'landing':
      $('btn-host')?.addEventListener('click',()=>{S.mode='host';S.screen='host-setup';render();});
      $('btn-player')?.addEventListener('click',()=>{S.mode='player';S.screen='player-join';render();});
      break;
    case 'host-setup':
      $('btn-open-lobby')?.addEventListener('click',()=>{
        const item=$('inp-item')?.value.trim();
        const price=parseFloat($('inp-price')?.value);
        const hint=$('inp-hint')?.value.trim()||'';
        if(!item){toast('Please enter an item name');return;}
        if(!price||price<=0){toast('Please enter a valid price');return;}
        S.currentItem=item;S.currentPrice=price;S.currentHint=hint;
        S.roomCode?showLobby():openHostPeer();
      });
      $('btn-back-results')?.addEventListener('click',()=>{S.screen='host-results';render();});
      break;
    case 'host-lobby':
      $('btn-start-game')?.addEventListener('click',startRound);
      $('btn-edit-setup')?.addEventListener('click',()=>{S.screen='host-setup';render();});
      break;
    case 'host-game':
      $('btn-end-early')?.addEventListener('click',endRound);
      break;
    case 'host-results':
      $('btn-new-round')?.addEventListener('click',()=>{S.screen='host-setup';render();});
      $('btn-end-game')?.addEventListener('click',resetGame);
      break;
    case 'player-join':
      $('inp-code')?.addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});
      const doJoin=()=>playerJoin();
      $('btn-join')?.addEventListener('click',doJoin);
      $('inp-name')?.addEventListener('keydown',e=>{if(e.key==='Enter')doJoin();});
      $('inp-code')?.addEventListener('keydown',e=>{if(e.key==='Enter')doJoin();});
      $('btn-back')?.addEventListener('click',()=>{S.screen='landing';render();});
      break;
    case 'player-game':
      $('btn-submit')?.addEventListener('click',submitBid);
      $('inp-bid')?.addEventListener('keydown',e=>{if(e.key==='Enter')submitBid();});
      break;
  }
}

/* ============================================================
   HOST LOGIC
============================================================ */
function openHostPeer(){
  S.roomCode=genCode();
  S.peer=new Peer('pir-'+S.roomCode,{debug:0});
  S.peer.on('open',()=>showLobby());
  S.peer.on('error',err=>{
    if(err.type==='unavailable-id'){S.peer.destroy();openHostPeer();}
    else toast('Connection error: '+err.message);
  });
  S.peer.on('connection',conn=>{
    conn.on('open',()=>{
      conn.on('data',data=>onHostData(data,conn));
      conn.on('close',()=>{
        const name=Object.keys(S.playerConns).find(n=>S.playerConns[n]===conn);
        if(name){S.players[name]={connected:false};if(S.screen==='host-lobby')refreshLobbyGrid();}
      });
    });
  });
}
function showLobby(){S.screen='host-lobby';render();}
function onHostData(data,conn){
  if(data.type==='join'){
    const name=String(data.name||'').trim().substring(0,20);
    if(!name){conn.send({type:'error',msg:'Invalid name'});return;}
    S.players[name]={connected:true};S.playerConns[name]=conn;
    if(!S.scores[name])S.scores[name]=0;
    if(S.screen==='host-lobby'){conn.send({type:'state',screen:'player-lobby'});refreshLobbyGrid();}
    else if(S.screen==='host-game'){conn.send({type:'start-round',item:S.currentItem,hint:S.currentHint,timeLeft:S.timeLeft});}
    else if(S.screen==='host-results'){sendResults(conn);}
  }else if(data.type==='bid'){
    if(S.screen!=='host-game')return;
    const amt=parseFloat(data.amount);if(isNaN(amt)||amt<0)return;
    S.bids[data.name]=amt;refreshGameGrid();
    const connected=Object.keys(S.players).filter(n=>S.players[n]?.connected);
    if(connected.length>0&&connected.every(n=>S.bids[n]!==undefined))endRound();
  }
}
function refreshLobbyGrid(){
  const grid=document.getElementById('player-grid');
  if(!grid){render();return;}
  const names=Object.keys(S.players);
  grid.innerHTML=names.length===0?`<p class="subtext">Waiting for players…</p>`:names.map(n=>`<div class="chip">🎯 ${esc(n)}</div>`).join('');
  if(names.length===1)render();
}
function refreshGameGrid(){
  const names=Object.keys(S.players);
  const grid=document.getElementById('player-grid');
  const count=document.getElementById('bid-count');
  if(grid)grid.innerHTML=names.map(n=>`<div class="chip ${S.bids[n]!==undefined?'submitted':''}">${S.bids[n]!==undefined?'✅':'⏳'} ${esc(n)}</div>`).join('');
  if(count)count.textContent=`${Object.keys(S.bids).length}/${names.length}`;
}
function startRound(){
  S.roundNum++;S.bids={};S.timeLeft=20;S.screen='host-game';render();
  broadcastAll({type:'start-round',item:S.currentItem,hint:S.currentHint,timeLeft:20});
  if(S.timer)clearInterval(S.timer);
  S.timer=setInterval(hostTick,1000);
}
function hostTick(){
  S.timeLeft--;
  if(S.timeLeft<=0){endRound();return;}
  const tn=document.getElementById('timer-num');
  const arc=document.getElementById('timer-arc');
  if(tn){tn.textContent=S.timeLeft;if(S.timeLeft<=5)tn.classList.add('urgent');}
  if(arc){const R=54,circ=2*Math.PI*R;arc.style.strokeDashoffset=circ*(1-S.timeLeft/20);if(S.timeLeft<=5)arc.classList.add('urgent');}
  const bc=document.getElementById('bid-count');
  if(bc)bc.textContent=`${Object.keys(S.bids).length}/${Object.keys(S.players).length}`;
}
function endRound(){
  if(S.screen!=='host-game')return;
  if(S.timer){clearInterval(S.timer);S.timer=null;}
  const{winnersArr}=calcWinner(S.bids,S.currentPrice);
  winnersArr.forEach(name=>{S.scores[name]=(S.scores[name]||0)+1;});
  S.screen='host-results';render();
  broadcastAll({type:'results',actualPrice:S.currentPrice,bids:S.bids,winnersArr});
}
function sendResults(conn){
  const{winnersArr}=calcWinner(S.bids,S.currentPrice);
  conn.send({type:'results',actualPrice:S.currentPrice,bids:S.bids,winnersArr});
}
function broadcastAll(msg){Object.values(S.playerConns).forEach(conn=>{try{conn.send(msg);}catch(e){}});}
function resetGame(){
  if(S.timer){clearInterval(S.timer);S.timer=null;}
  if(S.peer){S.peer.destroy();S.peer=null;}
  Object.assign(S,{mode:null,screen:'landing',roomCode:null,playerConns:{},players:{},bids:{},scores:{},currentItem:'',currentPrice:0,currentHint:'',roundNum:0});
  render();
}

   PLAYER LOGIC
============================================================ */
function playerJoin(){
  const name=document.getElementById('inp-name')?.value.trim();
  const code=document.getElementById('inp-code')?.value.trim().toUpperCase();
  const err=document.getElementById('join-error');
  if(!name){err.textContent='Please enter your name.';return;}
  if(name.length>20){err.textContent='Name too long (max 20 chars).';return;}
  if(!code||code.length!==4){err.textContent='Please enter a 4-letter room code.';return;}
  err.textContent='';
  const btn=document.getElementById('btn-join');
  btn.disabled=true;btn.textContent='⏳ Connecting…';
  S.myName=name;S.roomCode=code;
  const pid='pir-p-'+Math.random().toString(36).substr(2,9);
  S.peer=new Peer(pid,{debug:0});
  S.peer.on('open',()=>{
    S.hostConn=S.peer.connect('pir-'+code);
    S.hostConn.on('open',()=>S.hostConn.send({type:'join',name:S.myName}));
    S.hostConn.on('data',onPlayerData);
    S.hostConn.on('close',()=>toast('Connection to host lost.'));
    S.hostConn.on('error',()=>showJoinError('Connection failed. Check the room code.'));
  });
  S.peer.on('error',err2=>{
    if(err2.type==='peer-unavailable')showJoinError('Room not found. Check the code and try again.');
    else showJoinError('Error: '+err2.message);
  });
}
function showJoinError(msg){
  const err=document.getElementById('join-error');
  const btn=document.getElementById('btn-join');
  if(err)err.textContent=msg;
  if(btn){btn.disabled=false;btn.textContent='🎯  JOIN GAME!';}
}
function onPlayerData(data){
  if(data.type==='state'){if(data.screen==='player-lobby'){S.screen='player-lobby';render();}}
  else if(data.type==='start-round'){
    S.myBid=null;S.itemData={item:data.item,hint:data.hint};S.timeLeft=data.timeLeft||20;
    S.screen='player-game';render();
    if(S.timer)clearInterval(S.timer);S.timer=setInterval(playerTick,1000);
  }else if(data.type==='results'){
    if(S.timer){clearInterval(S.timer);S.timer=null;}
    S.roundResults=data;S.screen='player-results';render();
  }else if(data.type==='error'){toast('Error: '+data.msg);S.screen='player-join';render();}
}
function playerTick(){
  S.timeLeft--;
  if(S.timeLeft<=0){clearInterval(S.timer);S.timer=null;if(S.screen==='player-game'){S.screen='player-submitted';render();}return;}
  const tn=document.getElementById('timer-num');const arc=document.getElementById('timer-arc');
  if(tn){tn.textContent=S.timeLeft;if(S.timeLeft<=5)tn.classList.add('urgent');}
  if(arc){const R=45,circ=2*Math.PI*R;arc.style.strokeDashoffset=circ*(1-S.timeLeft/20);if(S.timeLeft<=5)arc.classList.add('urgent');}
}
function submitBid(){
  const inp=document.getElementById('inp-bid');
  const amt=parseFloat(inp?.value);
  if(isNaN(amt)||amt<0){toast('Please enter a valid price!');return;}
  S.myBid=amt;
  try{S.hostConn.send({type:'bid',name:S.myName,amount:amt});}catch(e){}
  if(S.timer){clearInterval(S.timer);S.timer=null;}
  S.screen='player-submitted';render();
}

/* ============================================================
   QR
============================================================ */
function generateQR(){
  const mount=document.getElementById('qr-mount');if(!mount||!S.roomCode)return;
  const url=window.location.origin+window.location.pathname+'#join='+S.roomCode;
  const img=document.createElement('img');
  img.alt='QR';img.width=165;img.height=165;
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=165x165&data='+encodeURIComponent(url)+'&bgcolor=ffffff&color=000000&margin=12&format=png';
  const wrap=document.createElement('div');wrap.className='qr-wrap';wrap.appendChild(img);
  mount.appendChild(wrap);
}

render();
</script>
