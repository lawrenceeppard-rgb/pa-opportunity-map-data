<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏠 Wheel of Fortune — Home Alone Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Oswald:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #0e0a04;
  --surface: #1a1208;
  --surface2: #241a0c;
  --brick: #5c1f0a;
  --gold: #f0a500;
  --gold-light: #ffc840;
  --gold-dark: #9a6800;
  --red: #c0280a;
  --red-light: #e03a18;
  --blue: #1a3a6e;
  --text: #f5ede0;
  --text-dim: #7a6248;
  --silver: #d4c4a8;
  --radius: 12px;
  --tile-bg: #120d04;
  --tile-border: #3a2808;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow-x:hidden; }
body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
#app { min-height:100vh; position:relative; z-index:1; }

/* SNOW */
.snowfield { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.flake { position:absolute; top:-20px; color:rgba(255,255,255,.5); font-size:.9rem; animation:fall linear infinite; user-select:none; }
@keyframes fall { 0%{transform:translateY(0) rotate(0deg);opacity:.6} 100%{transform:translateY(110vh) rotate(360deg);opacity:0} }

/* TOAST */
#toast {
  position:fixed; bottom:24px; left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--gold); color:#111;
  font-family:'Boogaloo',cursive; font-size:1.05rem;
  padding:10px 26px; border-radius:100px; z-index:9999;
  transition:transform .3s; pointer-events:none; white-space:nowrap;
  box-shadow:0 4px 24px rgba(0,0,0,.6);
}
#toast.show { transform:translateX(-50%) translateY(0); }

/* BUTTONS */
.btn {
  font-family:'Boogaloo',cursive; font-size:1.15rem;
  padding:12px 24px; border:none; border-radius:var(--radius);
  cursor:pointer; transition:all .15s; letter-spacing:.4px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active:not(:disabled) { transform:scale(.97); }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn-gold  { background:var(--gold); color:#111; box-shadow:0 4px 20px rgba(240,165,0,.3); }
.btn-gold:hover:not(:disabled)  { background:var(--gold-light); }
.btn-dark  { background:var(--surface2); color:var(--text); border:2px solid rgba(240,165,0,.25); }
.btn-dark:hover:not(:disabled)  { background:#342210; border-color:var(--gold); }
.btn-red   { background:var(--red); color:#fff; }
.btn-red:hover:not(:disabled)   { background:var(--red-light); }
.btn-blue  { background:var(--blue); color:#fff; }
.btn-blue:hover:not(:disabled)  { background:#234fa0; }
.btn-sm  { font-size:.88rem; padding:7px 14px; border-radius:8px; }
.btn-lg  { font-size:1.4rem; padding:15px 34px; }
.w-full  { width:100%; }

/* INPUTS */
.form-group { display:flex; flex-direction:column; gap:7px; width:100%; }
label { font-size:.75rem; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
input[type="text"], input[type="number"] {
  background:var(--surface2); border:2px solid rgba(255,255,255,.07);
  border-radius:var(--radius); color:var(--text);
  font-family:'Nunito',sans-serif; font-size:1rem; padding:11px 15px;
  width:100%; outline:none; transition:border-color .2s;
}
input:focus { border-color:var(--gold); }

/* LOGO */
.ha-logo {
  font-family:'Oswald',sans-serif; font-weight:700;
  color:var(--gold); letter-spacing:2px;
  text-shadow:0 0 40px rgba(240,165,0,.4), 3px 3px 0 var(--gold-dark);
  line-height:1.05; text-align:center;
}
.ha-sub {
  font-family:'Boogaloo',cursive; color:var(--text-dim);
  letter-spacing:4px; text-transform:uppercase;
}

/* PROGRESS DOTS */
.progress-dots { display:flex; gap:10px; justify-content:center; align-items:center; }
.pdot {
  width:30px; height:30px; border-radius:50%;
  border:2px solid rgba(255,255,255,.15);
  display:flex; align-items:center; justify-content:center;
  font-family:'Boogaloo',cursive; font-size:.82rem; transition:all .3s;
}
.pdot.done   { background:var(--gold-dark); border-color:var(--gold); color:#fff; }
.pdot.active { background:var(--gold); border-color:var(--gold-light); color:#111; box-shadow:0 0 14px rgba(240,165,0,.5); }
.pdot.upcoming { color:var(--text-dim); }

/* LEADERBOARD STRIP */
.lb-strip {
  background:var(--surface); border:1px solid rgba(240,165,0,.15);
  border-radius:var(--radius); padding:10px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.lb-title { font-family:'Boogaloo',cursive; font-size:.8rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; flex-shrink:0; }
.lb-players { display:flex; gap:8px; flex-wrap:wrap; flex:1; }
.lb-card {
  background:var(--surface2); border:2px solid rgba(255,255,255,.07);
  border-radius:10px; padding:6px 12px; text-align:center;
  min-width:78px; transition:all .25s; position:relative; cursor:default;
}
.lb-card.lead { border-color:var(--gold); background:rgba(240,165,0,.1); box-shadow:0 0 14px rgba(240,165,0,.2); }
.lb-card.active-turn { border-color:#e03a18; box-shadow:0 0 12px rgba(224,58,24,.3); }
.lb-card.host-editable { cursor:pointer; }
.lb-card.host-editable:hover { border-color:var(--gold-light); background:rgba(240,165,0,.15); }
.lb-crown { position:absolute; top:-10px; left:50%; transform:translateX(-50%); font-size:.82rem; }
.lb-edit-icon { position:absolute; top:3px; right:4px; font-size:.6rem; color:var(--text-dim); opacity:.6; }
.lb-name { font-family:'Boogaloo',cursive; font-size:.85rem; max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lb-card.lead .lb-name { color:var(--gold); }
.lb-total { font-size:1.1rem; font-weight:800; color:var(--silver); }
.lb-round { font-size:.68rem; color:var(--text-dim); }

/* BOARD */
.board {
  background:var(--surface); border:2px solid rgba(240,165,0,.12);
  border-radius:var(--radius); padding:16px 14px;
  display:flex; flex-direction:column; gap:8px; align-items:center;
}
.board-row { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; align-items:center; }
.board-word { display:flex; gap:4px; }
.word-gap { width:10px; }
.tile {
  width:40px; height:48px;
  background:var(--tile-bg); border:2px solid var(--tile-border);
  border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-family:'Oswald',sans-serif; font-size:1.35rem; font-weight:700;
  color:transparent; transition:all .25s;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);
}
.tile.lit {
  background:var(--gold); color:#111;
  border-color:var(--gold-dark);
  box-shadow:0 0 12px rgba(240,165,0,.4), inset 0 -3px 0 rgba(0,0,0,.2);
  animation:flip .28s ease;
}
@keyframes flip { 0%{transform:scaleY(0)} 100%{transform:scaleY(1)} }
@media(max-width:580px) { .tile{width:27px;height:35px;font-size:.9rem} .word-gap{width:6px} }

/* STATUS / CAT BANNER */
.status {
  font-family:'Boogaloo',cursive; font-size:1.1rem;
  background:var(--surface); padding:11px 16px; border-radius:var(--radius);
  border-left:4px solid var(--gold); min-height:48px;
  display:flex; align-items:center;
}
.cat-banner {
  font-family:'Boogaloo',cursive; font-size:.95rem; color:var(--gold);
  text-align:center; background:var(--surface);
  padding:7px 18px; border-radius:var(--radius);
  border:1px solid rgba(240,165,0,.2);
}
.guessed-bar { font-size:.8rem; color:var(--text-dim); text-align:center; }
.g-letter { display:inline-block; background:rgba(255,255,255,.07); padding:1px 5px; border-radius:4px; margin:2px; font-weight:800; font-size:.78rem; }

/* WHEEL */
#wheel-canvas { border-radius:50%; box-shadow:0 0 60px rgba(240,165,0,.15),0 0 120px rgba(0,0,0,.7); max-width:100%; height:auto; display:block; }
.spin-badge {
  font-family:'Boogaloo',cursive; font-size:1.2rem;
  padding:9px 26px; border-radius:100px; min-width:160px; text-align:center;
  min-height:42px; display:flex; align-items:center; justify-content:center;
}
.sb-dollar   { background:var(--gold); color:#111; }
.sb-bankrupt { background:#2a0000; color:#ff7070; border:2px solid #880000; }
.sb-lose     { background:#1a1a1a; color:#888; }
.sb-free     { background:#1a4a1a; color:#7fff7f; border:2px solid #2a8a2a; }
.sb-empty    { background:transparent; border:2px solid rgba(255,255,255,.05); color:transparent; }

/* HOST LAYOUT */
.host-game { display:grid; grid-template-rows:auto auto 1fr; min-height:100vh; padding:10px; gap:10px; }
.hg-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.hg-controls { display:flex; gap:8px; flex-wrap:wrap; }
.hg-body { display:grid; grid-template-columns:1fr 330px; gap:14px; align-items:start; }
@media(max-width:800px) { .hg-body { grid-template-columns:1fr; } }
.hg-left { display:flex; flex-direction:column; gap:10px; }
.hg-right { display:flex; flex-direction:column; align-items:center; gap:10px; }

/* PLAYER GAME */
.player-game { display:flex; flex-direction:column; gap:12px; padding:14px; max-width:520px; margin:0 auto; min-height:100vh; }
.turn-banner { text-align:center; font-family:'Boogaloo',cursive; font-size:1.1rem; padding:11px; border-radius:var(--radius); }
.turn-banner.mine { background:rgba(240,165,0,.12); border:2px solid var(--gold); color:var(--gold); }
.turn-banner.wait { background:var(--surface); color:var(--text-dim); }

/* KEYBOARD */
.keys { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:320px; margin:0 auto; }
.key {
  width:44px; height:44px; border-radius:8px;
  border:2px solid rgba(255,255,255,.14);
  background:var(--surface2); color:var(--text);
  font-family:'Boogaloo',cursive; font-size:1.2rem;
  cursor:pointer; transition:all .12s;
  display:flex; align-items:center; justify-content:center;
}
.key:hover:not(:disabled) { background:var(--gold); border-color:var(--gold-light); color:#111; }
.key:disabled { opacity:.18; cursor:not-allowed; }
.key.vowel-key { border-color:rgba(192,40,10,.5); color:#e05030; }
.key.vowel-key:hover:not(:disabled) { background:#c0280a; border-color:#c0280a; color:#fff; }

/* MODAL */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:1000; display:flex; align-items:center; justify-content:center; padding:24px; }
.modal { background:var(--surface); border:2px solid rgba(240,165,0,.25); border-radius:var(--radius); padding:26px; max-width:400px; width:100%; }
.modal h3 { font-family:'Boogaloo',cursive; font-size:1.4rem; color:var(--gold); margin-bottom:14px; }
.modal-btns { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }

/* SCREENS */
.landing {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:32px 24px; text-align:center;
  background:radial-gradient(ellipse at 50% 30%, #2a1a08 0%, var(--bg) 70%);
}
.center-screen {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:24px; gap:16px; max-width:400px; margin:0 auto;
}
.lobby {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:24px; gap:16px; text-align:center;
}
.room-code {
  font-family:'Oswald',sans-serif; font-weight:700;
  font-size:clamp(3rem,10vw,5rem); color:var(--gold); letter-spacing:8px;
  text-shadow:0 0 40px rgba(240,165,0,.4);
}
.code-label { font-size:.8rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:2px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:500px; }
.chip { background:var(--surface2); border:2px solid rgba(240,165,0,.25); border-radius:100px; padding:7px 16px; font-family:'Boogaloo',cursive; }
.chip.me { border-color:var(--gold); background:rgba(240,165,0,.1); color:var(--gold); }

/* QR CODE */
.qr-wrap { background:#fff; padding:11px; border-radius:10px; box-shadow:0 0 40px rgba(240,165,0,.18),0 0 0 4px var(--gold-dark); display:inline-block; }
.qr-label { font-family:'Boogaloo',cursive; font-size:.75rem; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-top:7px; text-align:center; }

/* BETWEEN ROUNDS */
.between-screen {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:24px; gap:18px; text-align:center;
  background:radial-gradient(ellipse at 50% 30%, #2a1a08 0%, var(--bg) 70%);
}
.podium { display:flex; align-items:flex-end; gap:6px; justify-content:center; margin:6px 0; }
.podium-slot { display:flex; flex-direction:column; align-items:center; gap:5px; }
.podium-name { font-family:'Boogaloo',cursive; font-size:.85rem; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.podium-score { font-family:'Boogaloo',cursive; font-size:1rem; color:var(--gold); }
.podium-bar { border-radius:8px 8px 0 0; width:70px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; font-size:1.5rem; }
.podium-bar.p1 { background:linear-gradient(180deg,#c9921a,#6a4800); min-height:96px; }
.podium-bar.p2 { background:linear-gradient(180deg,#4a3010,#1a0e04); min-height:72px; }
.podium-bar.p3 { background:linear-gradient(180deg,#5c1f0a,#200a02); min-height:52px; }

/* FINAL */
.final-screen {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:24px; gap:16px; text-align:center;
}
.winner-name {
  font-family:'Oswald',sans-serif; font-weight:700;
  font-size:clamp(2.5rem,8vw,5rem); color:var(--gold);
  text-shadow:0 0 50px rgba(240,165,0,.5), 3px 3px 0 var(--gold-dark);
}
.full-lb { width:100%; max-width:460px; border-collapse:collapse; }
.full-lb th { font-family:'Boogaloo',cursive; color:var(--text-dim); font-size:.78rem; text-transform:uppercase; letter-spacing:1px; padding:9px 16px; border-bottom:2px solid rgba(255,255,255,.07); }
.full-lb td { font-family:'Boogaloo',cursive; font-size:1.05rem; padding:10px 16px; }
.full-lb tr:nth-child(even) td { background:var(--surface); }
.full-lb tr:first-child td { color:var(--gold); }

.flex-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
</style>

<body>
<div class="snowfield" id="snow"></div>
<div id="app"></div>
<div id="toast"></div>

<script>
// ============================================================
// HOME ALONE PUZZLES
// ============================================================
const HA_PUZZLES = [
  { puzzle:'KEEP THE CHANGE YA FILTHY ANIMAL',  category:'FAMOUS QUOTE',   emoji:'🔫' },
  { puzzle:'BUZZ YOUR GIRLFRIEND WOOF',          category:'FAMOUS QUOTE',   emoji:'😂' },
  { puzzle:'WET BANDITS',                        category:'THING',          emoji:'🕵️' },
  { puzzle:'MERRY CHRISTMAS YA FILTHY ANIMAL',   category:'FAMOUS QUOTE',   emoji:'🎄' },
];
const TOTAL_ROUNDS = HA_PUZZLES.length;

// ============================================================
// CONSTANTS
// ============================================================
const VOWEL_COST = 250;
const VOWELS = new Set(['A','E','I','O','U']);
const CONSONANTS = 'BCDFGHJKLMNPQRSTVWXYZ'.split('');
const PEER_PFX = 'hawof-';

const WEDGES = [
  {label:'$300',     value:300,          color:'#5c1f0a'},
  {label:'$500',     value:500,          color:'#1a3a6e'},
  {label:'BANKRUPT', value:'BANKRUPT',   color:'#080408', textColor:'#ff6060'},
  {label:'$600',     value:600,          color:'#8b3a00'},
  {label:'$400',     value:400,          color:'#3a1a6e'},
  {label:'$900',     value:900,          color:'#6e1a00'},
  {label:'LOSE\nTURN',value:'LOSE_A_TURN',color:'#181818'},
  {label:'$700',     value:700,          color:'#5c1f0a'},
  {label:'$250',     value:250,          color:'#1a4a2a'},
  {label:'$800',     value:800,          color:'#1a3a6e'},
  {label:'BANKRUPT', value:'BANKRUPT',   color:'#080408', textColor:'#ff6060'},
  {label:'$1000',    value:1000,         color:'#7a1a00'},
  {label:'$350',     value:350,          color:'#6e3800'},
  {label:'FREE\nSPIN',value:'FREE_SPIN', color:'#6e6000', textColor:'#ffe878'},
  {label:'$450',     value:450,          color:'#3a6e00'},
  {label:'$1500',    value:1500,         color:'#5a0a0a'},
  {label:'$550',     value:550,          color:'#0a3a5a'},
  {label:'$2000',    value:2000,         color:'#6e0000'},
  {label:'$650',     value:650,          color:'#4a1a0a'},
  {label:'$1200',    value:1200,         color:'#1a2a6e'},
];

// ============================================================
// STATE
// ============================================================
const S = {
  screen:'landing',
  peer:null, roomCode:'', isHost:false, myName:'',
  hostConn:null, playerConns:{},
  roundIdx:0,
  puzzle:'', category:'', emoji:'', revealed:[],
  players:{}, playerOrder:[], currentPlayerIdx:0,
  phase:'spin', spinResult:null, lastMsg:'',
  spinning:false, wheelAngle:0,
  editingPlayer:null,  // name of player being score-edited
};

// ============================================================
// SNOW
// ============================================================
function makeSnow(){
  const sf=document.getElementById('snow'); if(!sf) return;
  const g=['❄','❅','❆','·','✦'];
  for(let i=0;i<24;i++){
    const d=document.createElement('div'); d.className='flake';
    d.textContent=g[i%g.length];
    d.style.left=(Math.random()*100)+'%';
    d.style.animationDuration=(7+Math.random()*9)+'s';
    d.style.animationDelay=(-Math.random()*14)+'s';
    d.style.fontSize=(.5+Math.random()*.7)+'rem';
    d.style.opacity=(.25+Math.random()*.45);
    sf.appendChild(d);
  }
}

// ============================================================
// NETWORKING
// ============================================================
function genCode(){ return Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join(''); }

function startHost(){
  S.isHost=true; S.roomCode=genCode();
  S.players={}; S.playerOrder=[]; S.playerConns={};
  loadRound(0);
  if(S.peer){try{S.peer.destroy();}catch{} S.peer=null;}
  S.peer=new Peer(PEER_PFX+S.roomCode);
  S.peer.on('open',()=>{ S.screen='host-lobby'; render(); });
  S.peer.on('connection',conn=>{
    conn.on('data',data=>hostReceive(conn,data));
    conn.on('close',()=>{
      const name=Object.keys(S.playerConns).find(n=>S.playerConns[n]===conn);
      if(name){
        delete S.playerConns[name];
        toast(`${name} left`);
        if(S.screen==='host-game'&&currentPlayer()===name){
          S.lastMsg=`${name} left. Next player.`; advancePlayer(); broadcastState();
        }
        render();
      }
    });
  });
  S.peer.on('error',e=>toast('Error: '+e.type));
}

function loadRound(idx){
  const p=HA_PUZZLES[idx];
  S.roundIdx=idx;
  S.puzzle=p.puzzle; S.category=p.category; S.emoji=p.emoji;
  S.revealed=[]; S.currentPlayerIdx=0; S.phase='spin'; S.spinResult=null;
  S.wheelAngle=0; S.spinning=false;
  S.playerOrder.forEach(n=>{ if(S.players[n]) S.players[n].roundScore=0; });
}

function startPlayer(code,name){
  S.isHost=false; S.myName=name.trim(); S.roomCode=code.toUpperCase().trim();
  S.screen='player-joining'; render();
  if(S.peer){try{S.peer.destroy();}catch{} S.peer=null;}
  S.peer=new Peer();
  S.peer.on('open',()=>{
    const conn=S.peer.connect(PEER_PFX+S.roomCode,{reliable:true});
    S.hostConn=conn;
    conn.on('open',()=>conn.send({type:'join',name:S.myName}));
    conn.on('data',data=>playerReceive(data));
    conn.on('close',()=>{ toast('Disconnected'); S.screen='player-join'; render(); });
    conn.on('error',()=>{ toast('Could not connect'); S.screen='player-join'; render(); });
  });
  S.peer.on('error',()=>{ toast('Room not found'); S.screen='player-join'; render(); });
}

function hostReceive(conn,data){
  if(data.type==='join'){
    const name=(data.name||'').trim().slice(0,20);
    if(!name){conn.send({type:'error',msg:'Name required'});return;}
    if(S.screen!=='host-lobby'){conn.send({type:'error',msg:'Game in progress'});return;}
    S.playerConns[name]=conn;
    if(!S.players[name]) S.players[name]={roundScore:0,totalScore:0};
    if(!S.playerOrder.includes(name)) S.playerOrder.push(name);
    conn.send({type:'joined',name});
    broadcastState(); render(); return;
  }
  if(data.type==='action'){
    if(S.screen!=='host-game') return;
    const sender=Object.keys(S.playerConns).find(n=>S.playerConns[n]===conn);
    if(sender!==currentPlayer()){conn.send({type:'error',msg:"Not your turn"});return;}
    doAction(data.action,data.payload||{});
  }
}

function playerReceive(data){
  switch(data.type){
    case 'joined': S.screen='player-lobby'; render(); break;
    case 'state':  applyState(data.game); break;
    case 'error':  toast(data.msg); break;
  }
}

function broadcastState(){
  const g=getGameState();
  Object.values(S.playerConns).forEach(c=>{try{c.send({type:'state',game:g});}catch{}});
}

function getGameState(){
  return {
    puzzle:S.puzzle, category:S.category, emoji:S.emoji, revealed:S.revealed,
    players:S.players, playerOrder:S.playerOrder, currentPlayerIdx:S.currentPlayerIdx,
    phase:S.phase, spinResult:S.spinResult, lastMsg:S.lastMsg,
    roundIdx:S.roundIdx, hostScreen:S.screen,
  };
}

function applyState(g){
  S.puzzle=g.puzzle; S.category=g.category; S.emoji=g.emoji; S.revealed=g.revealed;
  S.players=g.players; S.playerOrder=g.playerOrder; S.currentPlayerIdx=g.currentPlayerIdx;
  S.phase=g.phase; S.spinResult=g.spinResult; S.lastMsg=g.lastMsg; S.roundIdx=g.roundIdx;
  const m={
    'host-lobby':'player-lobby','host-game':'player-game',
    'host-between':'player-between','host-final':'player-final'
  };
  S.screen=m[g.hostScreen]||S.screen;
  render();
}

// ============================================================
// GAME LOGIC
// ============================================================
function currentPlayer(){ return S.playerOrder[S.currentPlayerIdx]||''; }
function advancePlayer(){ S.currentPlayerIdx=(S.currentPlayerIdx+1)%Math.max(S.playerOrder.length,1); S.phase='spin'; S.spinResult=null; }
function countIn(l){ return S.puzzle.split('').filter(c=>c===l).length; }
function isSolved(){ return S.puzzle.split('').every(c=>c===' '||S.revealed.includes(c)); }

function doSolve(name){
  S.puzzle.split('').forEach(c=>{if(c!==' '&&!S.revealed.includes(c))S.revealed.push(c);});
  S.players[name].totalScore+=S.players[name].roundScore;
  S.lastMsg=`🏠 ${name} solved the puzzle!`;
  S.phase='solved';
  S.screen=S.roundIdx+1>=TOTAL_ROUNDS?'host-final':'host-between';
  broadcastState(); render();
}

function doAction(action,payload){
  const cp=currentPlayer(); if(!cp) return;
  switch(action){
    case 'spin': {
      if(S.phase!=='spin'||S.spinning) return;
      S.lastMsg=`${cp} is spinning…`; broadcastState(); render(); animateSpin(); break;
    }
    case 'guess': {
      if(S.phase!=='guess') return;
      const ltr=(payload.letter||'').toUpperCase();
      if(!ltr||VOWELS.has(ltr)||S.revealed.includes(ltr)) return;
      S.revealed.push(ltr);
      const cnt=countIn(ltr);
      if(cnt>0){
        const earn=cnt*S.spinResult;
        S.players[cp].roundScore+=earn;
        S.lastMsg=`${cp} found "${ltr}" ×${cnt} → +$${earn.toLocaleString()}`;
        S.phase='spin'; S.spinResult=null;
        if(isSolved()){doSolve(cp);return;}
      } else {
        S.lastMsg=`"${ltr}" not in puzzle. Next player!`; advancePlayer();
      }
      broadcastState(); render(); break;
    }
    case 'buy-vowel': {
      if(S.phase!=='spin') return;
      const v=(payload.letter||'').toUpperCase();
      if(!v||!VOWELS.has(v)||S.revealed.includes(v)) return;
      if(S.players[cp].roundScore<VOWEL_COST){toast(`Need $${VOWEL_COST}`);return;}
      S.players[cp].roundScore-=VOWEL_COST;
      S.revealed.push(v);
      const cnt=countIn(v);
      if(cnt>0){ S.lastMsg=`${cp} bought "${v}" — ${cnt} found!`; S.phase='spin'; if(isSolved()){doSolve(cp);return;} }
      else { S.lastMsg=`${cp} bought "${v}" — not in puzzle. Next player!`; advancePlayer(); }
      broadcastState(); render(); break;
    }
    case 'solve': {
      if(S.phase==='solved') return;
      const ans=(payload.answer||'').toUpperCase().replace(/\s+/g,' ').trim();
      if(ans===S.puzzle.trim()) doSolve(cp);
      else { S.lastMsg=`${cp} guessed wrong. Next player!`; advancePlayer(); broadcastState(); render(); }
      break;
    }
    case 'pass': {
      S.lastMsg=`${cp} passed. Next player!`; advancePlayer(); broadcastState(); render(); break;
    }
  }
}

function resolveSpin(idx){
  const w=WEDGES[idx]; S.spinResult=w.value; const cp=currentPlayer();
  if(w.value==='BANKRUPT'){
    S.players[cp].roundScore=0;
    S.lastMsg=`💸 BANKRUPT! ${cp} loses their round earnings. Next player.`;
    S.spinResult=null; advancePlayer(); broadcastState(); render();
  } else if(w.value==='LOSE_A_TURN'){
    S.lastMsg=`😬 Lose a Turn! ${cp} sits this one out.`;
    S.spinResult=null; advancePlayer(); broadcastState(); render();
  } else if(w.value==='FREE_SPIN'){
    S.lastMsg=`🎡 FREE SPIN! ${cp} spins again!`;
    S.phase='spin'; broadcastState(); render();
    setTimeout(()=>animateSpin(),700);
  } else {
    S.lastMsg=`${cp} landed on $${w.value.toLocaleString()}! Pick a consonant.`;
    S.phase='guess'; broadcastState(); render();
  }
}

// ============================================================
// WHEEL
// ============================================================
function drawWheel(){
  const canvas=document.getElementById('wheel-canvas'); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
  const R=Math.min(W,H)/2-10;
  const n=WEDGES.length,aw=(2*Math.PI)/n,rot=S.wheelAngle*Math.PI/180;
  ctx.clearRect(0,0,W,H);
  ctx.beginPath(); ctx.arc(cx,cy,R+8,0,2*Math.PI); ctx.fillStyle='#6a4000'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,R+5,0,2*Math.PI); ctx.fillStyle=S.spinning?'#ffc840':'#f0a500'; ctx.fill();
  for(let i=0;i<n;i++){
    const sa=i*aw-Math.PI/2+rot,ea=(i+1)*aw-Math.PI/2+rot,ma=(sa+ea)/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,sa,ea); ctx.closePath();
    ctx.fillStyle=WEDGES[i].color; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1.5; ctx.stroke();
    const lr=R*.67,lx=cx+Math.cos(ma)*lr,ly=cy+Math.sin(ma)*lr;
    ctx.save(); ctx.translate(lx,ly); ctx.rotate(ma+Math.PI/2);
    const tc=WEDGES[i].textColor||'#f5ede0';
    const raw=WEDGES[i].label.replace('\n','');
    ctx.font=`bold ${raw.length>5?9:11}px Nunito,sans-serif`;
    ctx.fillStyle=tc; ctx.textAlign='center'; ctx.textBaseline='middle';
    const lines=WEDGES[i].label.split('\n');
    if(lines.length>1){ctx.fillText(lines[0],0,-6.5);ctx.fillText(lines[1],0,6.5);}
    else ctx.fillText(lines[0],0,0);
    ctx.restore();
  }
  for(let i=0;i<n;i++){
    const a=i*aw-Math.PI/2+rot,dx=cx+Math.cos(a)*(R+2),dy=cy+Math.sin(a)*(R+2);
    ctx.beginPath(); ctx.arc(dx,dy,3,0,2*Math.PI); ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(cx,cy,22,0,2*Math.PI); ctx.fillStyle='#0e0a04'; ctx.fill();
  ctx.strokeStyle='#f0a500'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#f0a500'; ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('★',cx,cy);
  const py=cy-R-6;
  ctx.beginPath(); ctx.moveTo(cx,py+22); ctx.lineTo(cx-10,py); ctx.lineTo(cx+10,py); ctx.closePath();
  ctx.fillStyle='#f0a500'; ctx.fill(); ctx.strokeStyle='#0e0a04'; ctx.lineWidth=2.5; ctx.stroke();
}

function animateSpin(){
  if(S.spinning) return;
  S.spinning=true;
  const n=WEDGES.length,wDeg=360/n,tWedge=Math.floor(Math.random()*n);
  const D=(tWedge+0.5)*wDeg;
  const minRot=(5+Math.floor(Math.random()*4))*360;
  const k=Math.ceil((S.wheelAngle+minRot+D)/360);
  const targetAngle=-D+k*360;
  const dur=3000+Math.random()*1200;
  const t0=performance.now(),a0=S.wheelAngle;
  function ease(t){return 1-Math.pow(1-t,3.5);}
  function frame(now){
    const el2=now-t0,t=Math.min(el2/dur,1);
    S.wheelAngle=a0+(targetAngle-a0)*ease(t);
    drawWheel();
    if(t<1) requestAnimationFrame(frame);
    else { S.wheelAngle=targetAngle; S.spinning=false; drawWheel(); resolveSpin(tWedge); }
  }
  requestAnimationFrame(frame);
}

// ============================================================
// LAYOUT
// ============================================================
function layoutPuzzle(text){
  if(!text) return [];
  const words=text.toUpperCase().split(' '),rows=[],MAX=13;
  let row=[],len=0;
  for(const w of words){
    const need=len===0?w.length:w.length+1;
    if(len+need<=MAX||row.length===0){row.push(w);len+=(row.length===1?w.length:need);}
    else{rows.push(row);row=[w];len=w.length;}
  }
  if(row.length) rows.push(row);
  return rows;
}

function renderBoard(puzzle,revealed){
  if(!puzzle) return '<div class="board"><div style="padding:20px;color:var(--text-dim)">No puzzle</div></div>';
  const rows=layoutPuzzle(puzzle);
  let h='<div class="board">';
  for(const row of rows){
    h+='<div class="board-row">';
    for(let i=0;i<row.length;i++){
      if(i>0) h+='<div class="word-gap"></div>';
      h+='<div class="board-word">';
      for(const ch of row[i]){
        const lit=revealed.includes(ch)||ch===' ';
        h+=`<div class="tile ${lit?'lit':''}">${lit&&ch!==' '?ch:''}</div>`;
      }
      h+='</div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}

function leaderboardStrip(isHost=false, highlightCurrent=false){
  if(!S.playerOrder.length) return '';
  const cp=currentPlayer();
  const maxTotal=Math.max(...S.playerOrder.map(n=>S.players[n]?.totalScore||0));
  const cards=S.playerOrder.map(n=>{
    const p=S.players[n]||{roundScore:0,totalScore:0};
    const isLead=p.totalScore===maxTotal&&maxTotal>0;
    const isTurn=highlightCurrent&&n===cp;
    const editClass=isHost?' host-editable':'';
    return `<div class="lb-card ${isLead?'lead':''} ${isTurn?'active-turn':''}${editClass}" ${isHost?`data-edit-player="${esc(n)}"`:''}">
      ${isLead?'<div class="lb-crown">👑</div>':''}
      ${isHost?'<div class="lb-edit-icon">✏️</div>':''}
      <div class="lb-name">${esc(n)}</div>
      <div class="lb-total">$${p.totalScore.toLocaleString()}</div>
      ${p.roundScore>0?`<div class="lb-round">+$${p.roundScore.toLocaleString()} rnd</div>`:''}
    </div>`;
  }).join('');
  return `<div class="lb-strip">
    <div class="lb-title">🏆 Scores ${isHost?'<span style="font-size:.65rem;opacity:.5">(tap to edit)</span>':''}</div>
    <div class="lb-players">${cards}</div>
  </div>`;
}

function progressDots(){
  let h='<div class="progress-dots">';
  for(let i=0;i<TOTAL_ROUNDS;i++){
    let cls=i<S.roundIdx?'done':i===S.roundIdx?'active':'upcoming';
    h+=`<div class="pdot ${cls}">${i<S.roundIdx?'✓':i+1}</div>`;
    if(i<TOTAL_ROUNDS-1) h+='<div style="width:16px;height:2px;background:rgba(255,255,255,.08);border-radius:1px"></div>';
  }
  return h+'</div>';
}

  <div class="status" style="font-size:1rem">${S.lastMsg||'&nbsp;'}</div>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <div class="lb-card active"><div class="lb-name">Round</div><div class="lb-total">$${me.roundScore.toLocaleString()}</div></div>
    <div class="lb-card"><div class="lb-name">Total</div><div class="lb-total" style="color:var(--silver)">$${me.totalScore.toLocaleString()}</div></div>
  </div>
  <div class="turn-banner ${mine?'mine':'wait'}">${mine?"⭐ It's your turn!":`Waiting for ${esc(cp)}…`}</div>
  ${actionHtml}
  ${vowelModal}${solveModal}
</div>`;
}

function buildPodium(sorted){
  if(!sorted.length) return '';
  const order=[1,0,2].filter(i=>i<sorted.length);
  const barCls=['p2','p1','p3'],medals=['🥈','🥇','🥉'];
  let h='<div class="podium">';
  for(let j=0;j<order.length;j++){
    const i=order[j],n=sorted[i],p=S.players[n]||{totalScore:0};
    h+=`<div class="podium-slot">
      <div class="podium-name">${esc(n)}</div>
      <div class="podium-score">$${p.totalScore.toLocaleString()}</div>
      <div class="podium-bar ${barCls[j]}">${medals[j]}</div>
    </div>`;
  }
  return h+'</div>';
}

function htmlHostBetween(){
  const next=HA_PUZZLES[S.roundIdx+1];
  const sorted=[...S.playerOrder].sort((a,b)=>(S.players[b]?.totalScore||0)-(S.players[a]?.totalScore||0));
  return `<div class="between-screen">
  ${progressDots()}
  <div style="font-size:1.8rem">🏠</div>
  <div class="ha-logo" style="font-size:1.8rem">Round ${S.roundIdx+1} Complete!</div>
  <div style="color:var(--text-dim);font-family:'Boogaloo',cursive">The answer was:</div>
  <div style="font-family:'Boogaloo',cursive;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--gold);
    background:var(--surface);padding:12px 24px;border-radius:var(--radius);
    border:2px solid rgba(240,165,0,.2);max-width:680px;word-break:break-word">
    ${esc(S.puzzle)}
  </div>
  ${buildPodium(sorted)}
  <div style="color:var(--text-dim);font-family:'Boogaloo',cursive">
    Next: ${next.emoji} <strong style="color:var(--text)">${esc(next.category)}</strong>
  </div>
  <button class="btn btn-gold btn-lg" id="b-next-round">▶ Round ${S.roundIdx+2}</button>
</div>`;
}

function htmlPlayerBetween(){
  const sorted=[...S.playerOrder].sort((a,b)=>(S.players[b]?.totalScore||0)-(S.players[a]?.totalScore||0));
  return `<div class="between-screen">
  ${progressDots()}
  <div class="ha-logo" style="font-size:1.5rem">Round ${S.roundIdx+1} Complete!</div>
  <div style="color:var(--text-dim);font-family:'Boogaloo',cursive">The answer was:</div>
  <div style="font-family:'Boogaloo',cursive;font-size:1.05rem;color:var(--gold);
    background:var(--surface);padding:10px 20px;border-radius:var(--radius);word-break:break-word">
    ${esc(S.puzzle)}
  </div>
  ${buildPodium(sorted)}
  <div style="color:var(--text-dim);font-size:.85rem">Waiting for host to start next round…</div>
</div>`;
}

function htmlHostFinal(){
  const sorted=[...S.playerOrder].sort((a,b)=>(S.players[b]?.totalScore||0)-(S.players[a]?.totalScore||0));
  const winner=sorted[0]||'';
  const medals=['🥇','🥈','🥉'];
  const rows=sorted.map((n,i)=>`<tr><td>${medals[i]||i+1}</td><td>${esc(n)}</td><td>$${(S.players[n]?.totalScore||0).toLocaleString()}</td></tr>`).join('');
  return `<div class="final-screen">
  <div style="font-size:2.5rem">🏠🎉🏠</div>
  <div style="font-family:'Boogaloo',cursive;color:var(--text-dim);font-size:.95rem;letter-spacing:2px;text-transform:uppercase">🏆 Winner</div>
  <div class="winner-name">${esc(winner)}</div>
  <div style="color:var(--text-dim);font-family:'Boogaloo',cursive">Final Standings</div>
  <table class="full-lb">
    <thead><tr><th>#</th><th>Player</th><th>Total</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <button class="btn btn-gold btn-lg" id="b-play-again">🏠 Play Again</button>
</div>`;
}

function htmlPlayerFinal(){
  const sorted=[...S.playerOrder].sort((a,b)=>(S.players[b]?.totalScore||0)-(S.players[a]?.totalScore||0));
  const winner=sorted[0]||'',myRank=sorted.indexOf(S.myName)+1;
  const medals=['🥇','🥈','🥉'];
  const rows=sorted.map((n,i)=>`<tr><td>${medals[i]||i+1}</td><td>${esc(n)}${n===S.myName?' ⭐':''}</td><td>$${(S.players[n]?.totalScore||0).toLocaleString()}</td></tr>`).join('');
  return `<div class="final-screen">
  <div style="font-size:2rem">${myRank===1?'🏆':'🏠'}</div>
  <div class="winner-name" style="font-size:clamp(1.8rem,6vw,3.5rem)">${esc(winner)}</div>
  ${myRank===1?`<div style="color:var(--gold);font-family:'Boogaloo',cursive;font-size:1.1rem">That's you! 🎉</div>`:''}
  <table class="full-lb">
    <thead><tr><th>#</th><th>Player</th><th>Total</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div style="color:var(--text-dim);font-family:'Boogaloo',cursive;font-style:italic">"Keep the change, ya filthy animal." 🏠</div>
</div>`;
}

// ============================================================
// RENDER
// ============================================================
function render(){
  const app=document.getElementById('app');
  switch(S.screen){
    case 'landing':        app.innerHTML=htmlLanding(); break;
    case 'player-join':    app.innerHTML=htmlJoin(); break;
    case 'player-joining': app.innerHTML=htmlJoining(); break;
    case 'host-lobby':     app.innerHTML=htmlHostLobby(); break;
    case 'player-lobby':   app.innerHTML=htmlPlayerLobby(); break;
    case 'host-game':      app.innerHTML=htmlHostGame(); requestAnimationFrame(drawWheel); break;
    case 'player-game':    app.innerHTML=htmlPlayerGame(); break;
    case 'host-between':   app.innerHTML=htmlHostBetween(); break;
    case 'player-between': app.innerHTML=htmlPlayerBetween(); break;
    case 'host-final':     app.innerHTML=htmlHostFinal(); break;
    case 'player-final':   app.innerHTML=htmlPlayerFinal(); break;
    default: app.innerHTML=htmlLanding();
  }
  bindEvents();
}

function bindEvents(){
  switch(S.screen){
    case 'landing':
      on('b-host',startHost);
      on('b-join-go',()=>{ S.screen='player-join'; render(); });
      break;
    case 'player-join':
      el('inp-code')?.addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,''));
      on('b-do-join',()=>{
        const code=v('inp-code').toUpperCase().trim(),name=v('inp-name').trim();
        if(code.length!==4){toast('Enter 4-letter code');return;}
        if(!name){toast('Enter your name');return;}
        startPlayer(code,name);
      });
      on('b-back',()=>{ S.screen='landing'; render(); });
      el('inp-name')?.addEventListener('keydown',e=>{ if(e.key==='Enter') el('b-do-join')?.click(); });
      break;
    case 'host-lobby':
      on('b-start',()=>{
        if(!S.playerOrder.length){toast('Need at least 1 player');return;}
        S.playerOrder.forEach(n=>{S.players[n]={roundScore:0,totalScore:0};});
        loadRound(0);
        S.lastMsg=`${currentPlayer()}'s turn — spin the wheel!`;
        S.screen='host-game'; broadcastState(); render();
      });
      (function(){
        const qrDiv=el('qr-code'); if(!qrDiv) return;
        const url=location.origin+location.pathname+'?room='+S.roomCode;
        new QRCode(qrDiv,{text:url,width:140,height:140,colorDark:'#111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      })();
      break;
    case 'host-game':
      on('b-skip',()=>{ const cp=currentPlayer(); S.lastMsg=`Host skipped ${cp}.`; advancePlayer(); broadcastState(); render(); });
      on('b-reveal',()=>{
        if(confirm('Reveal the full answer?')){
          S.puzzle.split('').forEach(c=>{if(c!==' '&&!S.revealed.includes(c))S.revealed.push(c);});
          S.lastMsg='Answer revealed.'; broadcastState(); render();
        }
      });
      on('b-end-round',()=>{
        if(confirm('End this round?')){
          S.phase='solved';
          S.screen=S.roundIdx+1>=TOTAL_ROUNDS?'host-final':'host-between';
          broadcastState(); render();
        }
      });
      // Score editor — tap player card
      document.querySelectorAll('[data-edit-player]').forEach(card=>{
        card.addEventListener('click',()=>openScoreEditor(card.dataset.editPlayer));
      });
      // Score editor modal buttons
      on('edit-cancel',()=>{ S.editingPlayer=null; render(); });
      on('edit-apply',applyScoreEdit);
      el('edit-total')?.addEventListener('keydown',e=>{ if(e.key==='Enter') el('edit-apply')?.click(); });
      el('edit-round')?.addEventListener('keydown',e=>{ if(e.key==='Enter') el('edit-apply')?.click(); });
      drawWheel();
      break;
    case 'player-game':
      on('act-spin',()=>sendAction('spin',{}));
      on('act-pass',()=>sendAction('pass',{}));
      on('act-buy-vowel',()=>{ const m=el('modal-vowel'); if(m)m.style.display='flex'; });
      on('vowel-cancel',()=>{ el('modal-vowel').style.display='none'; });
      document.querySelectorAll('[data-vowel]').forEach(b=>b.addEventListener('click',()=>{
        sendAction('buy-vowel',{letter:b.dataset.vowel}); el('modal-vowel').style.display='none';
      }));
      on('act-solve',()=>{ const m=el('modal-solve'); if(m)m.style.display='flex'; setTimeout(()=>el('solve-inp')?.focus(),80); });
      on('solve-cancel',()=>{ el('modal-solve').style.display='none'; });
      on('solve-submit',()=>{ sendAction('solve',{answer:v('solve-inp')}); el('modal-solve').style.display='none'; });
      el('solve-inp')?.addEventListener('keydown',e=>{ if(e.key==='Enter') el('solve-submit')?.click(); });
      document.querySelectorAll('[data-ltr]').forEach(b=>b.addEventListener('click',()=>sendAction('guess',{letter:b.dataset.ltr})));
      break;
    case 'host-between':
      on('b-next-round',()=>{
        loadRound(S.roundIdx+1);
        S.lastMsg=`Round ${S.roundIdx+1}! ${currentPlayer()}'s turn — spin!`;
        S.screen='host-game'; broadcastState(); render();
      });
      break;
    case 'host-final':
      on('b-play-again',()=>{ S.screen='host-lobby'; render(); });
      break;
  }
}

// ============================================================
// UTILS
// ============================================================
function sendAction(action,payload){ if(!S.hostConn){toast('Not connected');return;} S.hostConn.send({type:'action',action,payload}); }
function on(id,fn){ el(id)?.addEventListener('click',fn); }
function el(id){ return document.getElementById(id); }
function v(id){ return el(id)?.value||''; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let _tt=null;
function toast(msg){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  if(_tt) clearTimeout(_tt);
  _tt=setTimeout(()=>t.classList.remove('show'),3200);
}

// ============================================================
// INIT
// ============================================================
makeSnow();
render();
</script>
</body>
</html>
