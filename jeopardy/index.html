<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jeopardy! — Classroom Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Barlow+Condensed:wght@700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --jblue:#060CE9;
  --jblue-dark:#0407A0;
  --jblue-deeper:#03037A;
  --jblue-cell:#0B0BCC;
  --jblue-used:#02024A;
  --jgold:#FFD700;
  --jgold2:#E0A800;
  --red:#CC0000;
  --green:#00AA44;
  --white:#FFFFFF;
}
html,body{min-height:100%;overflow-x:hidden}
body{
  background:var(--jblue-deeper);
  font-family:'Nunito',sans-serif;
  color:var(--white);
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(6,12,233,0.4) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}
#app{position:relative;z-index:1}

/* ── LOGO ────────────────────────────────────────── */
.logo-wrap{
  text-align:center;
  padding:18px 16px 8px;
  background:linear-gradient(180deg,#0000CC 0%,var(--jblue-deeper) 100%);
  border-bottom:3px solid var(--jgold);
  position:sticky;top:0;z-index:100;
}
.logo-main{
  font-family:'Playfair Display',serif;
  font-style:italic;font-weight:900;
  font-size:clamp(2rem,8vw,3.8rem);
  color:var(--jgold);
  letter-spacing:.02em;
  text-shadow:3px 3px 0 var(--jblue-dark),5px 5px 12px rgba(0,0,0,0.6);
  line-height:1;
}
.logo-main .bang{color:var(--white)}
.logo-sub{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:clamp(.6rem,1.5vw,.75rem);
  letter-spacing:.6em;color:rgba(255,255,255,0.45);
  text-transform:uppercase;margin-top:3px;padding-bottom:2px;
}

/* ── LAYOUT ──────────────────────────────────────── */
.container{max-width:900px;margin:0 auto;padding:14px 14px 40px}
.two-col{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.two-col>*{flex:1;min-width:220px}

/* ── CARDS ───────────────────────────────────────── */
.card{
  background:rgba(0,0,120,0.45);
  border:1.5px solid rgba(255,215,0,0.25);
  border-radius:12px;padding:20px;margin-bottom:12px;
  backdrop-filter:blur(8px);
}
.card-gold{background:rgba(180,130,0,0.18);border-color:rgba(255,215,0,0.6);}
.card-green{background:rgba(0,120,50,0.2);border-color:rgba(0,200,80,0.4);}
.card-red{background:rgba(150,0,0,0.2);border-color:rgba(220,0,0,0.4);}

/* ── TYPE ────────────────────────────────────────── */
.section-title{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:1.2rem;color:var(--jgold);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:12px;
  display:flex;align-items:center;gap:7px;
}
.subtext{color:rgba(255,255,255,0.5);font-size:.88rem}
hr.divider{border:none;border-top:1px solid rgba(255,215,0,0.2);margin:12px 0}

/* ── BUTTONS ─────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 24px;border-radius:6px;
  font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:none;
  white-space:nowrap;line-height:1;transition:transform .12s,filter .12s,box-shadow .12s;
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-gold{background:linear-gradient(180deg,#FFE555,#FFD000 50%,#E09000);color:#000;box-shadow:0 4px 18px rgba(255,190,0,0.4);}
.btn-gold:not(:disabled):hover{filter:brightness(1.09);transform:translateY(-2px)}
.btn-blue{background:linear-gradient(180deg,#2233FF,#0606CC);color:#fff;box-shadow:0 4px 14px rgba(0,0,200,0.4);}
.btn-blue:not(:disabled):hover{filter:brightness(1.12)}
.btn-green{background:linear-gradient(180deg,#22DD66,#007733);color:#fff;box-shadow:0 4px 14px rgba(0,150,60,0.4);}
.btn-red{background:linear-gradient(180deg,#FF2222,#990000);color:#fff;box-shadow:0 4px 14px rgba(180,0,0,0.4);}
.btn-ghost{background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.8);}
.btn-ghost:hover{background:rgba(255,255,255,0.15)}
.btn-lg{padding:15px 40px;font-size:1.2rem}
.btn-sm{padding:7px 16px;font-size:.88rem}
.btn-xs{padding:5px 11px;font-size:.8rem}
.btn-block{display:flex;width:100%}

/* ── INPUTS ──────────────────────────────────────── */
.input-group{margin-bottom:12px}
.input-label{
  display:block;font-weight:900;font-size:.72rem;letter-spacing:.15em;
  color:var(--jgold);text-transform:uppercase;margin-bottom:4px;
  font-family:'Barlow Condensed',sans-serif;
}
.input-field{
  width:100%;padding:10px 14px;
  background:rgba(0,0,80,0.6);
  border:2px solid rgba(255,215,0,0.3);border-radius:6px;
  color:#fff;font-size:.95rem;font-family:'Nunito',sans-serif;font-weight:700;
  outline:none;transition:border-color .2s,background .2s;
}
.input-field:focus{border-color:var(--jgold);background:rgba(0,0,100,0.8)}
.input-field::placeholder{color:rgba(255,255,255,0.25)}

/* ── BOARD ───────────────────────────────────────── */
.board-wrap{width:100%;overflow-x:auto;padding-bottom:6px}
.board{
  display:grid;
  gap:5px;
  width:100%;min-width:460px;
}
.board-cat{
  background:var(--jblue-dark);
  color:var(--jgold);
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:clamp(.75rem,2vw,1rem);
  text-align:center;text-transform:uppercase;letter-spacing:.05em;
  padding:12px 6px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  min-height:70px;line-height:1.2;
  border:2px solid rgba(255,215,0,0.3);
}
.board-cell{
  background:var(--jblue-cell);
  color:var(--jgold);
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:clamp(1.1rem,3vw,2rem);
  text-align:center;
  padding:10px 4px;border-radius:6px;
  cursor:pointer;border:2px solid rgba(255,215,0,0.25);
  transition:background .15s,transform .1s,box-shadow .15s;
  min-height:60px;display:flex;align-items:center;justify-content:center;
  text-shadow:2px 2px 4px rgba(0,0,0,0.5);
  user-select:none;
}
.board-cell:hover:not(.used){
  background:#1A1AFF;transform:scale(1.04);
  box-shadow:0 0 20px rgba(255,215,0,0.4);border-color:var(--jgold);
}
.board-cell.used{
  background:var(--jblue-used);color:transparent;
  cursor:default;border-color:rgba(255,255,255,0.05);
  box-shadow:none;
}

/* ── CLUE DISPLAY ────────────────────────────────── */
.clue-box{
  background:var(--jblue-dark);
  border:3px solid var(--jgold);border-radius:12px;
  padding:28px 24px;text-align:center;margin-bottom:14px;
  animation:pop-in .3s ease both;
}
.clue-category{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:.85rem;letter-spacing:.4em;color:rgba(255,255,255,0.5);
  text-transform:uppercase;margin-bottom:10px;
}
.clue-points{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:2rem;color:var(--jgold);margin-bottom:14px;
  text-shadow:2px 2px 0 rgba(0,0,0,0.4);
}
.clue-text{
  font-family:'Playfair Display',serif;font-weight:700;
  font-size:clamp(1.1rem,3.5vw,1.6rem);color:#fff;
  line-height:1.5;max-width:600px;margin:0 auto;
}
@keyframes pop-in{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

/* ── BUZZ ────────────────────────────────────────── */
.buzz-btn{
  background:linear-gradient(180deg,#FF3333,#AA0000);
  color:#fff;border:none;border-radius:50%;
  width:clamp(160px,45vw,200px);height:clamp(160px,45vw,200px);
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:clamp(1.8rem,6vw,2.5rem);letter-spacing:.08em;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(200,0,0,0.6),0 0 0 6px rgba(255,50,50,0.3);
  transition:transform .1s,box-shadow .1s;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto;
  animation:buzz-pulse 2s ease-in-out infinite;
}
.buzz-btn:active{transform:scale(.93);box-shadow:0 4px 15px rgba(200,0,0,0.5);}
.buzz-btn:disabled{background:linear-gradient(180deg,#555,#333);box-shadow:none;animation:none;cursor:not-allowed;opacity:.5;}
@keyframes buzz-pulse{0%,100%{box-shadow:0 8px 30px rgba(200,0,0,0.6),0 0 0 6px rgba(255,50,50,0.3)}50%{box-shadow:0 8px 30px rgba(200,0,0,0.8),0 0 0 12px rgba(255,50,50,0.15)}}

/* ── BUZZ LIST ───────────────────────────────────── */
.buzz-list{list-style:none;margin-top:10px}
.buzz-list li{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;border-radius:8px;margin-bottom:6px;
  font-weight:800;font-size:1rem;
  background:rgba(255,255,255,0.07);
  animation:slide-up .25s ease both;
}
.buzz-list li.first{background:rgba(255,215,0,0.18);border:1.5px solid rgba(255,215,0,0.5);}
.buzz-list li.wrong{background:rgba(180,0,0,0.15);opacity:.55;}
@keyframes slide-up{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.buzz-rank{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.2rem;width:24px;color:var(--jgold);opacity:.7}

/* ── SCORE TABLE ─────────────────────────────────── */
.score-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;border-radius:8px;margin-bottom:5px;
  font-weight:700;font-size:.95rem;
  background:rgba(255,255,255,0.05);
}
.score-row:first-of-type{background:rgba(255,215,0,0.15)}
.score-name{flex:1}
.score-val{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:1.2rem;min-width:80px;text-align:right;
}
.score-val.pos{color:var(--jgold)}
.score-val.neg{color:#FF6666}

/* ── LIBRARY ─────────────────────────────────────── */
.game-card{
  background:rgba(0,0,80,0.5);border:2px solid rgba(255,215,0,0.2);
  border-radius:10px;padding:14px 16px;margin-bottom:9px;
  display:flex;align-items:center;gap:11px;
  transition:border-color .2s,box-shadow .2s;
}
.game-card:hover{border-color:rgba(255,215,0,0.5);box-shadow:0 3px 14px rgba(0,0,0,0.3)}
.game-card-info{flex:1;min-width:0}
.game-card-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.15rem;color:var(--jgold);letter-spacing:.04em}
.game-card-meta{font-size:.78rem;color:rgba(255,255,255,0.4);margin-top:2px}
.game-card-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}

/* ── EDITOR ──────────────────────────────────────── */
.cat-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.cat-tab{
  padding:8px 16px;border-radius:6px 6px 0 0;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.95rem;
  letter-spacing:.06em;cursor:pointer;border:none;
  background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.6);
  transition:background .15s,color .15s;
}
.cat-tab.active{background:var(--jblue-dark);color:var(--jgold);border-bottom:2px solid var(--jgold);}
.clue-editor-row{
  display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;align-items:start;
  margin-bottom:8px;
}
.clue-pts-badge{
  background:var(--jblue-dark);border:1.5px solid rgba(255,215,0,0.4);
  border-radius:6px;padding:10px 4px;text-align:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:1.1rem;color:var(--jgold);
}

/* ── QR ──────────────────────────────────────────── */
.qr-wrap{display:inline-block;background:#fff;border-radius:10px;padding:9px;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
.qr-wrap img{display:block;border-radius:3px}

/* ── ROOM CODE ───────────────────────────────────── */
.room-code{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:clamp(3rem,10vw,5rem);color:var(--jgold);
  letter-spacing:.2em;line-height:1;
  text-shadow:3px 3px 0 rgba(0,0,0,0.4),0 0 30px rgba(255,215,0,0.3);
}
.room-code-label{
  font-size:.68rem;letter-spacing:.45em;color:rgba(255,255,255,0.4);
  text-transform:uppercase;margin-bottom:3px;font-family:'Barlow Condensed',sans-serif;
}

/* ── PLAYER CHIPS ────────────────────────────────── */
.player-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{
  background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.2);
  border-radius:5px;padding:6px 13px;font-weight:800;font-size:.88rem;
  display:flex;align-items:center;gap:5px;
}
.chip.buzz-first{background:rgba(255,215,0,0.2);border-color:var(--jgold);color:var(--jgold);animation:glow-gold 1s infinite alternate;}
@keyframes glow-gold{from{box-shadow:0 0 5px rgba(255,215,0,0.3)}to{box-shadow:0 0 16px rgba(255,215,0,0.7)}}

/* ── WAITING ─────────────────────────────────────── */
.waiting-dots span{display:inline-block;animation:wdot 1.4s ease-in-out infinite both;font-size:1.5rem;color:var(--jgold);}
.waiting-dots span:nth-child(2){animation-delay:.2s}
.waiting-dots span:nth-child(3){animation-delay:.4s}
@keyframes wdot{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

.confetti-row{text-align:center;font-size:1.5rem;letter-spacing:.2em;margin:5px 0 10px;animation:slide-up .4s ease both}
.join-error{color:#FF8888;font-size:.87rem;margin-top:8px;text-align:center;min-height:18px;font-weight:700}
.live-dot{width:8px;height:8px;border-radius:50%;background:#00CC44;display:inline-block;margin-right:5px;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── TOAST ───────────────────────────────────────── */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);
  background:rgba(0,0,60,0.95);border:1.5px solid rgba(255,215,0,0.5);color:#fff;
  padding:10px 22px;border-radius:5px;font-weight:800;font-size:.9rem;
  transition:transform .25s;z-index:999;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── PROGRESS BAR ────────────────────────────────── */
.progress-bar-wrap{height:6px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden;flex:1}
.progress-bar-fill{height:100%;background:var(--jgold);border-radius:99px;transition:width .4s}

@media(max-width:520px){
  .card{padding:14px}.btn-lg{padding:13px 26px;font-size:1.05rem}
  .two-col>*{min-width:100%}.clue-editor-row{grid-template-columns:60px 1fr}
  .clue-editor-row .response-col{display:none}
}
</style>
</head>
<body>

<div class="logo-wrap" id="logo-wrap">
  <div class="logo-main">Jeopardy<span class="bang">!</span></div>
  <div class="logo-sub">— Classroom Edition —</div>
</div>

<div id="app"></div>
<div id="toast"></div>

<script>
const POINTS = [200, 400, 600, 800, 1000];
const NUM_CATS = 6;
const JEOPARDY_URL = 'https://lawrenceeppard-rgb.github.io/pa-opportunity-map-data/jeopardy/';

/* ── STATE ───────────────────────────────────────── */
const S = {
  mode:null, screen:'landing',
  roomCode:null, peer:null, timer:null,
  // Host
  playerConns:{}, players:{}, scores:{},
  activeGame:null, editGame:null,
  usedClues:{}, // "ci-qi" → true
  currentClue:null, // {ci,qi,clue,response,points,catName}
  buzzQueue:[], wrongBuzzers:new Set(), buzzOpen:false,
  editorTab:0,
  // Player
  hostConn:null, myName:'', myScore:0,
  clueData:null, buzzState:'none', // 'open','i-buzzed','other-buzzed','wrong','done'
  buzzedBy:null,
};

/* ── LIBRARY ─────────────────────────────────────── */
const LIB_KEY='jeop_games_v1';
function libLoad(){try{return JSON.parse(localStorage.getItem(LIB_KEY))||[];}catch(e){return[];}}
function libSaveAll(g){localStorage.setItem(LIB_KEY,JSON.stringify(g));}
function libSaveGame(game){
  const games=libLoad();
  if(!game.id)game.id='j_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
  game.savedAt=new Date().toISOString();
  const i=games.findIndex(g=>g.id===game.id);
  if(i>=0)games[i]=game;else games.push(game);
  libSaveAll(games);return game;
}
function libDeleteGame(id){libSaveAll(libLoad().filter(g=>g.id!==id));}
function libExport(){
  const blob=new Blob([JSON.stringify({jeop:true,version:1,games:libLoad()},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Jeopardy_Games_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function libImport(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.jeop||!Array.isArray(data.games)){toast('Invalid file');return;}
      const ex=libLoad();let n=0;
      data.games.forEach(g=>{if(!ex.find(e=>e.id===g.id)){ex.push(g);n++;}});
      libSaveAll(ex);toast('Imported '+n+' game'+(n!==1?'s':''));render();
    }catch(e){toast('Could not read file');}
  };
  r.readAsText(file);
}

/* ── UTILS ───────────────────────────────────────── */
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<4;i++)r+=c[Math.floor(Math.random()*c.length)];return r;}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function el(id){return document.getElementById(id);}
function toast(msg,ms=2800){const t=el('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms);}
function fmtScore(n){return(n<0?'-$'+Math.abs(n):'$'+n);}
function blankGame(){
  return{id:null,name:'',categories:Array.from({length:NUM_CATS},(_,i)=>({
    name:'Category '+(i+1),
    clues:POINTS.map(p=>({clue:'',response:'',points:p}))
  }))};
}
function sortedScores(){return Object.entries(S.scores).sort((a,b)=>b[1]-a[1]);}
function clueKey(ci,qi){return ci+'-'+qi;}
function cluesRemaining(){
  if(!S.activeGame)return 0;
  let n=0;
  S.activeGame.categories.forEach((cat,ci)=>cat.clues.forEach((_,qi)=>{if(!S.usedClues[clueKey(ci,qi)])n++;}));
  return n;
}

/* ── RENDER ──────────────────────────────────────── */
function render(){
  el('app').innerHTML=getHTML();
  bindEvents();
  const hide=S.screen==='host-lobby'||S.screen==='host-board'||S.screen==='host-clue'||S.screen==='host-final';
  const logoWrap=document.getElementById('logo-wrap');
  if(logoWrap)logoWrap.style.display=hide?'none':'';
  if(S.screen==='host-lobby'){setTimeout(generateQR,0);}
}
function getHTML(){
  switch(S.screen){
    case 'landing':          return htmlLanding();
    case 'library':          return htmlLibrary();
    case 'game-editor':      return htmlGameEditor();
    case 'host-lobby':       return htmlHostLobby();
    case 'host-board':       return htmlHostBoard();
    case 'host-clue':        return htmlHostClue();
    case 'host-final':       return htmlHostFinal();
    case 'player-join':      return htmlPlayerJoin();
    case 'player-joining':   return htmlPlayerJoining();
    case 'player-lobby':     return htmlPlayerLobby();
    case 'player-clue':      return htmlPlayerClue();
    default:return'<div class="container"><div class="card">…</div></div>';
  }
}

/* ── SCREENS ─────────────────────────────────────── */
function htmlLanding(){
  const m=window.location.hash.match(/join=([A-Z0-9]{4})/i);
  if(m){setTimeout(()=>{S.mode='player';S.screen='player-join';render();},60);
    return'<div class="container"><div class="card" style="text-align:center"><p style="color:var(--jgold)">Joining game…</p></div></div>';}
  return `<div class="container">
    <div class="card" style="text-align:center;padding:34px 22px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.9rem;color:var(--jgold);letter-spacing:.06em;margin-bottom:8px">WELCOME!</div>
      <p class="subtext" style="margin-bottom:28px;font-size:1rem">Are you running the game or playing?</p>

/* ── BIND EVENTS ─────────────────────────────────── */
function bindEvents(){
  switch(S.screen){
    case 'landing':
      el('btn-host')&&el('btn-host').addEventListener('click',()=>{S.mode='host';S.screen='library';render();});
      el('btn-player')&&el('btn-player').addEventListener('click',()=>{S.mode='player';S.screen='player-join';render();});
      break;
    case 'library':
      el('btn-new-game')&&el('btn-new-game').addEventListener('click',()=>{S.editGame=blankGame();S.editorTab=0;S.screen='game-editor';render();});
      el('btn-lib-export')&&el('btn-lib-export').addEventListener('click',libExport);
      el('inp-import')&&el('inp-import').addEventListener('change',e=>{if(e.target.files[0])libImport(e.target.files[0]);});
      document.querySelectorAll('.btn-play-game').forEach(btn=>btn.addEventListener('click',()=>playGame(btn.dataset.id)));
      document.querySelectorAll('.btn-edit-game').forEach(btn=>btn.addEventListener('click',()=>{
        const g=libLoad().find(g=>g.id===btn.dataset.id);
        if(g){S.editGame=JSON.parse(JSON.stringify(g));S.editorTab=0;S.screen='game-editor';render();}
      }));
      document.querySelectorAll('.btn-del-game').forEach(btn=>btn.addEventListener('click',()=>{
        if(confirm('Delete this game?')){libDeleteGame(btn.dataset.id);render();}
      }));
      el('btn-lib-back')&&el('btn-lib-back').addEventListener('click',()=>{S.screen='landing';render();});
      break;
    case 'game-editor':
      document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
        syncEditorTab();S.editorTab=+btn.dataset.tab;render();
      }));
      el('btn-save-game')&&el('btn-save-game').addEventListener('click',()=>{if(!doSaveGame())return;S.screen='library';render();toast('Game saved!');});
      el('btn-save-play')&&el('btn-save-play').addEventListener('click',()=>{if(!doSaveGame())return;playGame(S.editGame.id);});
      el('btn-editor-cancel')&&el('btn-editor-cancel').addEventListener('click',()=>{S.screen='library';render();});
      break;
    case 'host-lobby':
      el('btn-start-game')&&el('btn-start-game').addEventListener('click',startGame);
      break;
    case 'host-board':
      document.querySelectorAll('.board-cell:not(.used)').forEach(cell=>cell.addEventListener('click',()=>{
        activateClue(+cell.dataset.ci,+cell.dataset.qi);
      }));
      el('btn-final-scores')&&el('btn-final-scores').addEventListener('click',()=>{S.screen='host-final';render();broadcastAll({type:'game-over',scores:S.scores});});
      el('btn-end-game')&&el('btn-end-game').addEventListener('click',()=>resetGame(true));
      break;
    case 'host-clue':
      el('btn-correct')&&el('btn-correct').addEventListener('click',judgeCorrect);
      el('btn-wrong')&&el('btn-wrong').addEventListener('click',judgeWrong);
      el('btn-reopen-buzz')&&el('btn-reopen-buzz').addEventListener('click',reopenBuzz);
      el('btn-skip-clue')&&el('btn-skip-clue').addEventListener('click',skipClue);
      el('btn-back-board')&&el('btn-back-board').addEventListener('click',()=>{
        // Mark clue used and go back without judging
        skipClue();
      });
      break;
    case 'host-final':
      el('btn-play-again')&&el('btn-play-again').addEventListener('click',()=>{
        S.scores={};S.usedClues={};Object.keys(S.players).forEach(n=>S.scores[n]=0);
        S.screen='host-board';render();
        broadcastAll({type:'reset-scores',scores:S.scores});
      });
      el('btn-final-library')&&el('btn-final-library').addEventListener('click',()=>resetGame(true));
      break;
    case 'player-join':
      el('inp-code')&&el('inp-code').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});
      el('btn-join')&&el('btn-join').addEventListener('click',playerJoin);
      el('inp-name')&&el('inp-name').addEventListener('keydown',e=>{if(e.key==='Enter')playerJoin();});
      el('inp-code')&&el('inp-code').addEventListener('keydown',e=>{if(e.key==='Enter')playerJoin();});
      el('btn-back')&&el('btn-back').addEventListener('click',()=>{S.screen='landing';render();});
      break;
    case 'player-clue':
      el('btn-buzz')&&el('btn-buzz').addEventListener('click',()=>{
        if(S.buzzState!=='open')return;
        S.buzzState='i-buzzed';render();
        try{S.hostConn.send({type:'buzz',name:S.myName});}catch(e){}
      });
      break;
  }
}

/* ── EDITOR HELPERS ──────────────────────────────── */
function syncEditorTab(){
  const n=el('inp-game-name');if(n)S.editGame.name=n.value;
  const cn=el('inp-cat-name');if(cn)S.editGame.categories[S.editorTab].name=cn.value;
  document.querySelectorAll('.clue-input').forEach(e=>{S.editGame.categories[S.editorTab].clues[+e.dataset.qi].clue=e.value;});
  document.querySelectorAll('.response-input').forEach(e=>{S.editGame.categories[S.editorTab].clues[+e.dataset.qi].response=e.value;});
}
function doSaveGame(){
  syncEditorTab();
  const name=S.editGame.name.trim();
  if(!name){toast('Please give your game a name');return false;}
  let hasClue=false;
  S.editGame.categories.forEach(cat=>{cat.clues.forEach(cl=>{if(cl.clue&&cl.clue.trim())hasClue=true;});});
  if(!hasClue){toast('Add at least one clue');return false;}
  // Trim all
  S.editGame.categories.forEach(cat=>{
    cat.name=(cat.name||'').trim();
    cat.clues.forEach(cl=>{cl.clue=(cl.clue||'').trim();cl.response=(cl.response||'').trim();});
  });
  libSaveGame(S.editGame);return true;
}

/* ── PLAY GAME ───────────────────────────────────── */
function playGame(id){
  const g=libLoad().find(g=>g.id===id);
  if(!g){toast('Game not found');return;}
  S.activeGame=JSON.parse(JSON.stringify(g));
  S.usedClues={};S.scores={};
  S.screen='host-lobby';
  if(!S.peer||S.peer.destroyed)openHostPeer();
  else render();
}

/* ── HOST LOGIC ──────────────────────────────────── */
function openHostPeer(){
  S.roomCode=genCode();
  S.peer=new Peer('jeop-'+S.roomCode,{debug:0});
  S.peer.on('open',()=>render());
  S.peer.on('error',err=>{
    if(err.type==='unavailable-id'){S.peer.destroy();openHostPeer();}
    else toast('Connection error: '+err.message);
  });
  S.peer.on('connection',conn=>{
    conn.on('open',()=>{
      conn.on('data',data=>onHostData(data,conn));
      conn.on('close',()=>{
        const name=Object.keys(S.playerConns).find(n=>S.playerConns[n]===conn);
        if(name&&S.screen==='host-lobby'){S.players[name]={connected:false};refreshLobbyGrid();}
      });
    });
  });
}
function onHostData(data,conn){
  if(data.type==='join'){
    const name=String(data.name||'').trim().substring(0,20);
    if(!name){conn.send({type:'error',msg:'Invalid name'});return;}
    S.players[name]={connected:true};S.playerConns[name]=conn;
    if(!S.scores[name])S.scores[name]=0;
    if(S.screen==='host-lobby'){conn.send({type:'state',screen:'player-lobby'});refreshLobbyGrid();}
    else if(S.screen==='host-board'){conn.send({type:'state',screen:'player-lobby'});}
    else if(S.screen==='host-clue'){conn.send({type:'clue',clue:S.currentClue.clue,catName:S.currentClue.catName,points:S.currentClue.points,buzzOpen:S.buzzOpen});}
  }else if(data.type==='buzz'){
    if(S.screen!=='host-clue'||!S.buzzOpen)return;
    const name=data.name;
    if(!S.buzzQueue.includes(name)&&!S.wrongBuzzers.has(name)){
      S.buzzQueue.push(name);
      if(S.buzzQueue.length===1){
        // First buzzer — lock buzz for others
        S.buzzOpen=false;
        broadcastAll({type:'buzz-locked',name});
      }
      render();
    }
  }
}
function refreshLobbyGrid(){
  const grid=el('player-grid');if(!grid){render();return;}
  const names=Object.keys(S.players);
  grid.innerHTML=names.length===0?'<p class="subtext">Waiting for players to join…</p>':names.map(n=>`<div class="chip">🎯 ${esc(n)}</div>`).join('');
  if(names.length===1)render();
}
function startGame(){
  S.screen='host-board';render();
  broadcastAll({type:'game-started'});
}
function activateClue(ci,qi){
  const cat=S.activeGame.categories[ci];
  const cl=cat.clues[qi];
  S.currentClue={ci,qi,clue:cl.clue,response:cl.response,points:cl.points,catName:cat.name};
  S.buzzQueue=[];S.wrongBuzzers=new Set();S.buzzOpen=true;
  S.screen='host-clue';render();
  broadcastAll({type:'clue',clue:cl.clue,catName:cat.name,points:cl.points,buzzOpen:true});
}
function judgeCorrect(){
  const cl=S.currentClue;
  const winner=S.buzzQueue.find(n=>!S.wrongBuzzers.has(n));
  if(!winner)return;
  S.scores[winner]=(S.scores[winner]||0)+cl.points;
  S.usedClues[clueKey(cl.ci,cl.qi)]=true;
  broadcastAll({type:'clue-done',winner,scores:S.scores,correct:true});
  S.screen='host-board';render();
}
function judgeWrong(){
  const cl=S.currentClue;
  const loser=S.buzzQueue.find(n=>!S.wrongBuzzers.has(n));
  if(!loser)return;
  S.scores[loser]=(S.scores[loser]||0)-cl.points;
  S.wrongBuzzers.add(loser);
  // Re-open buzz for remaining players
  const remaining=Object.keys(S.players).filter(n=>!S.wrongBuzzers.has(n)&&S.players[n]?.connected);
  if(remaining.length>0){
    S.buzzOpen=true;
    broadcastAll({type:'buzz-wrong',loser,scores:S.scores});
  }else{
    broadcastAll({type:'clue-done',winner:null,scores:S.scores,correct:false});
  }
  render();
}
function reopenBuzz(){
  S.buzzOpen=true;
  broadcastAll({type:'buzz-open'});
  render();
}
function skipClue(){
  if(S.currentClue)S.usedClues[clueKey(S.currentClue.ci,S.currentClue.qi)]=true;
  broadcastAll({type:'clue-done',winner:null,scores:S.scores,correct:false});
  S.screen='host-board';render();
}
function broadcastAll(msg){Object.values(S.playerConns).forEach(conn=>{try{conn.send(msg);}catch(e){}});}
function resetGame(toLibrary){
  if(S.peer&&toLibrary){S.peer.destroy();S.peer=null;S.roomCode=null;}
  Object.assign(S,{
    screen:toLibrary?'library':'host-lobby',
    playerConns:toLibrary?{}:S.playerConns,
    players:toLibrary?{}:S.players,
    scores:{},usedClues:{},currentClue:null,
    buzzQueue:[],wrongBuzzers:new Set(),buzzOpen:false,
    activeGame:toLibrary?null:S.activeGame,
  });
  render();
}

/* ── PLAYER LOGIC ────────────────────────────────── */
function playerJoin(){
  const name=el('inp-name')&&el('inp-name').value.trim();
  const code=el('inp-code')&&el('inp-code').value.trim().toUpperCase();
  const err=el('join-error');
  if(!name){if(err)err.textContent='Please enter your name.';return;}
  if(name.length>20){if(err)err.textContent='Name too long.';return;}
  if(!code||code.length!==4){if(err)err.textContent='Please enter the 4-letter room code.';return;}
  if(err)err.textContent='';
  const btn=el('btn-join');if(btn){btn.disabled=true;btn.textContent='⏳ Connecting…';}
  S.myName=name;S.roomCode=code;
  const pid='jeop-p-'+Math.random().toString(36).substr(2,9);
  S.peer=new Peer(pid,{debug:0});
  S.peer.on('open',()=>{
    S.hostConn=S.peer.connect('jeop-'+code);
    S.hostConn.on('open',()=>{S.screen='player-joining';render();S.hostConn.send({type:'join',name:S.myName});});
    S.hostConn.on('data',onPlayerData);
    S.hostConn.on('close',()=>toast('Connection to host lost.'));
    S.hostConn.on('error',()=>showJoinError('Connection failed. Check the room code.'));
  });
  S.peer.on('error',e=>{
    if(e.type==='peer-unavailable')showJoinError('Room not found.');
    else showJoinError('Error: '+e.message);
  });
}
function showJoinError(msg){
  const e=el('join-error'),b=el('btn-join');
  if(e)e.textContent=msg;if(b){b.disabled=false;b.textContent='🎯  JOIN GAME!';}
}
function onPlayerData(data){
  if(data.type==='state'){
    if(data.screen==='player-lobby'){S.screen='player-lobby';render();}
  }else if(data.type==='game-started'){
    S.screen='player-lobby';render();
  }else if(data.type==='clue'){
    S.clueData={clue:data.clue,catName:data.catName,points:data.points};
    S.buzzState=data.buzzOpen?'open':'other-buzzed';
    S.buzzedBy=null;S.screen='player-clue';render();
  }else if(data.type==='buzz-locked'){
    if(S.buzzState!=='i-buzzed'){S.buzzState='other-buzzed';S.buzzedBy=data.name;}
    render();
  }else if(data.type==='buzz-wrong'){
    if(data.loser===S.myName){S.buzzState='wrong';S.myScore=(S.myScore||0)-S.clueData.points;}
    else S.buzzState='open'; // re-opened
    render();
  }else if(data.type==='buzz-open'){
    if(S.buzzState!=='i-buzzed'&&S.buzzState!=='wrong'){S.buzzState='open';}
    render();
  }else if(data.type==='clue-done'){
    if(data.winner===S.myName){S.myScore=(S.myScore||0)+S.clueData.points;}
    // update from authoritative scores
    if(data.scores&&data.scores[S.myName]!==undefined)S.myScore=data.scores[S.myName];
    S.buzzState='done';render();
  }else if(data.type==='reset-scores'){
    S.myScore=data.scores[S.myName]||0;S.buzzState='done';S.screen='player-lobby';render();
  }else if(data.type==='game-over'){
    if(data.scores&&data.scores[S.myName]!==undefined)S.myScore=data.scores[S.myName];
    S.screen='player-lobby';render();
  }else if(data.type==='error'){
    toast('Error: '+data.msg);S.screen='player-join';render();
  }
}

/* ── QR ──────────────────────────────────────────── */
function generateQR(){
  const mount=el('qr-mount');if(!mount||!S.roomCode)return;
  mount.innerHTML='';
  const url=JEOPARDY_URL+'#join='+S.roomCode;
  const img=document.createElement('img');img.alt='QR';img.width=180;img.height=180;
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url)+'&bgcolor=ffffff&color=000000&margin=12&format=png';
  const wrap=document.createElement('div');wrap.className='qr-wrap';wrap.appendChild(img);
  mount.appendChild(wrap);
}
